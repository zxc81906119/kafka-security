# 第 33 章:靜態 quorum → 動態 quorum 的設定切換。由 scripts/quorum-lab.sh upgrade 加進 .env 的 COMPOSE_FILE。
# 官方(Confluent Platform 8.3,KRaft 設定頁):遷移步驟是 ① kafka-features upgrade --feature kraft.version=1
#   ② 每個 controller 與 broker 移除 controller.quorum.voters、改設 controller.quorum.bootstrap.servers ③ 依序重啟。
# 這個檔只做 ②:把靜態名單拿掉、改指到 bootstrap 名單(動態 quorum 的成員清單存在叢集 metadata 裡,不再靠設定檔)。
x-dynq: &dynq
  KAFKA_CONTROLLER_QUORUM_VOTERS: ""
  KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: controller1:9093,controller2:9093,controller3:9093

services:
  controller1: { environment: *dynq }
  controller2: { environment: *dynq }
  controller3: { environment: *dynq }
  broker1: { environment: *dynq }
  broker2: { environment: *dynq }
  broker3: { environment: *dynq }
  broker4: { environment: *dynq }
