# 第 21 章(HA):3 台 controller + 3 台 broker,副本 3、min.insync.replicas 2——與手冊第 1 章「正式環境至少 3 台 controller、副本 3」對應。
# 用法:scripts/ha.sh on   (會清掉資料、以 HA 設定重建;scripts/ha.sh off 回到基礎環境)
# 與基礎環境的差異(只有這些):
#   - controller2、controller3、broker3(設定沿用 controller1 / broker2,只改節點名稱與編號)
#   - quorum 為 3 個 voter(靜態 controller.quorum.voters;正式環境依官方建議用動態 quorum,這裡為了簡化用靜態)
#   - 內部 topic 與預設副本數 3、min.insync.replicas 2
# 注意:HA 模式不要同時開 cyberark、sr 這類額外 profile(記憶體);用完 scripts/ha.sh off。
x-ha-rf: &ha-rf
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_TOPIC_REPLICAS: 3
  KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 3

x-ha-ctrl: &ha-ctrl
  <<: *ha-rf
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
  KAFKA_CONFLUENT_BALANCER_GOAL_VIOLATION_DELAY_ON_NEW_BROKERS_MS: 180000   # 第 31 章 demo 專用:預設 1800000(30 分鐘),broker 有變動後負載不均偵測器暫停這麼久。官方設定頁沒列這項(從 broker 的有效設定看到),正式環境維持預設
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL     # 第 31 章:KRaft 下 Self-Balancing 跑在 controller,官方要求 controller 也設 inter.broker.listener.name(沒設會找不到 bootstrap)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL     # 同上:controller 不監聽 INTERNAL,只是以 client 身分連 broker 的 INTERNAL 埠(balancer)
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12   # mTLS 身分 CN=kafka-internal(super user),與 broker 的內部通道相同
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_PASSWORD: changeit
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEY_PASSWORD: changeit
  KAFKA_CONFLUENT_METADATA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
  KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092

# 第 22 章:controller 也把指標送到 Prometheus(KRaft 下 ActiveControllerCount、OfflinePartitionsCount 只有 controller 有)
x-ha-ctrl-telemetry: &ha-ctrl-telemetry
  KAFKA_METRIC_REPORTERS: io.confluent.telemetry.reporter.TelemetryReporter
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: "http"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "true"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL: "https://prometheus:9090/api/v1/otlp"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION: "gzip"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY: "telemetry"            # api.key / api.secret 就是 Prometheus 的 Basic 帳密
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET: "telemetry-pw"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX: "80"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX: "4000"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX: "10"
  KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS: "60000"
  KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE: "io.confluent.kafka.server.controller.(?!.*delta).*|io.confluent.kafka.server.raft.(?!.*delta).*|io.confluent.kafka.server.kafka.controller.(?!.*delta).*"

# 第 22 章:JMX exporter(Prometheus 官方 Java agent)——每個 broker 與 controller 在 7778 埠開 /metrics,供 Prometheus 抓取。
# agent(Maven Central)與各元件的設定檔(Confluent 官方 jmx-monitoring-stacks,釘定 commit 並校驗 SHA-256)由 scripts/jmx-setup.sh 下載到 config/jmx/(scripts/ha.sh on 會自動執行)。
x-ha-jmx-broker: &ha-jmx-broker
  KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_broker_tls.yml"
x-ha-jmx-controller: &ha-jmx-controller
  KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_controller_tls.yml"

services:
  controller1:
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-ctrl, *ha-ctrl-telemetry, *ha-jmx-controller]
  controller2:
    extends: { file: docker-compose.yml, service: controller1 }
    container_name: controller2
    hostname: controller2
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/controller2/9093'"]
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-ctrl, *ha-ctrl-telemetry, *ha-jmx-controller]
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://controller2:9093
  controller3:
    extends: { file: docker-compose.yml, service: controller1 }
    container_name: controller3
    hostname: controller3
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/controller3/9093'"]
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-ctrl, *ha-ctrl-telemetry, *ha-jmx-controller]
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://controller3:9093

  broker1:
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
  broker2:
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
  broker3:
    extends: { file: docker-compose.yml, service: broker2 }
    container_name: broker3
    hostname: broker3
    depends_on:
      controller1: { condition: service_healthy }
      controller2: { condition: service_healthy }
      controller3: { condition: service_healthy }
      openldap: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9094 && exec 3<>/dev/tcp/localhost/8093'"]
    ports: !override
      - "${HOST_PORT_MDS3:-8093}:8093"
      - "${HOST_PORT_BROKER3:-19294}:9094"
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
      KAFKA_NODE_ID: 13
      KAFKA_LISTENERS: INTERNAL://broker3:9092,CLIENT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:9092,CLIENT://broker3:9094
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: https://0.0.0.0:8093
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: https://broker3:8093

  # 第 31 章:Self-Balancing 的「加 broker」「移除 broker」實驗用的第 4 台(只在 --profile sbc 啟動;scripts/sbc-lab.sh 會啟動它)
  broker4:
    extends: { file: docker-compose.yml, service: broker2 }
    container_name: broker4
    hostname: broker4
    profiles: ["sbc"]
    depends_on:
      controller1: { condition: service_healthy }
      controller2: { condition: service_healthy }
      controller3: { condition: service_healthy }
      openldap: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9094 && exec 3<>/dev/tcp/localhost/8094'"]
    ports: !override
      - "${HOST_PORT_MDS4:-8094}:8094"
      - "${HOST_PORT_BROKER4:-19394}:9094"
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
      KAFKA_NODE_ID: 14
      KAFKA_LISTENERS: INTERNAL://broker4:9092,CLIENT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker4:9092,CLIENT://broker4:9094
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: https://0.0.0.0:8094
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: https://broker4:8094

  # 第 32 章:Tiered Storage 的物件儲存(S3 相容)。測試用 MinIO(RELEASE.2025-09-07);正式環境用客戶行內的 S3 相容物件儲存。
  # 只在 --profile tier 啟動;scripts/tier-setup.sh on 會產生帳密與 TLS 檔、建 bucket 與專用帳號。
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    profiles: ["tier"]
    command: server /data --console-address :9001 --certs-dir /certs
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER_FILE: /run/tier/root-user
      MINIO_ROOT_PASSWORD_FILE: /run/tier/root-password
      MINIO_KMS_SECRET_KEY_FILE: /run/tier/kms-key     # 測試用靜態金鑰,讓 MinIO 接受伺服器端加密(Kafka 預設 AES256);正式環境用 KES + 行內 KMS/HSM
    volumes:
      - minio-data:/data
      - ./config/tier/certs:/certs:ro
      - ./config/tier/secrets:/run/tier:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:9000/minio/health/live"]     # 本機探測,不驗證憑證(只問「活著嗎」)
      interval: 10s
      timeout: 5s
      retries: 12

  # 第 23 章:TLS 憑證到期探測(只在需要時用 --profile c3 一起啟動)
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    profiles: ["c3"]
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--web.config.file=/etc/blackbox/web-config.yml"]
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./config/blackbox/web-config.yml:/etc/blackbox/web-config.yml:ro
      - ./certs/server.pem:/etc/blackbox/server.pem:ro          # blackbox 自己的 HTTPS 憑證(共用 server 憑證,SAN 含 blackbox-exporter)
      - ./certs/server.key:/etc/blackbox/server.key:ro
      - ./certs/ca.pem:/etc/blackbox/ca.pem:ro
      - ./certs/client-legacy-other.pem:/etc/blackbox/probe-client.pem:ro    # 無權限的 client 憑證,只用來完成 mTLS 握手
      - ./certs/client-legacy-other.key:/etc/blackbox/probe-client.key:ro

  # ===== 第 26 章:Grafana 與主機 / consumer lag 指標(profile grafana;用 scripts/grafana.sh on 啟動,會先備妥密碼與帳號) =====
  grafana:
    image: grafana/grafana:latest                     # 測試版本 13.2.3(記錄在 DESIGN-BASIS);正式環境請釘定版本
    container_name: grafana
    hostname: grafana
    profiles: ["grafana"]
    # 啟動前才從密碼檔讀 LDAP bind 密碼進環境變數(ldap.toml 只能展開環境變數);密碼不寫在 compose,docker inspect 看不到
    entrypoint: ["/bin/sh", "-c", "export LDAP_BIND_PW=$$(cat /etc/grafana/secrets/ldap-bind.pw); exec /run.sh"]
    ports: ["3000:3000"]
    environment:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/tls/server.pem
      GF_SERVER_CERT_KEY: /etc/tls/server.key
      GF_SERVER_DOMAIN: localhost
      GF_SECURITY_ADMIN_USER: admin                         # 本機 admin 只留給 break-glass(AD 掛了還能進來),日常用 AD 帳號登入
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/grafana/secrets/admin.pw
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_LDAP_ENABLED: "true"
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"                    # 第一次用 AD 帳號登入時自動建立 Grafana 使用者(角色由群組對映決定)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_METRICS_ENABLED: "true"
      GF_METRICS_BASIC_AUTH_USERNAME: Prometheus
      GF_METRICS_BASIC_AUTH_PASSWORD__FILE: /etc/grafana/secrets/metrics.pw
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - ./config/grafana/secrets:/etc/grafana/secrets:ro
      - ./certs:/etc/tls:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    profiles: ["grafana"]
    command:
      - --path.rootfs=/host
      - --web.config.file=/etc/node-exporter/web-config.yml
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro                                          # 容器環境看到的是 Docker 主機(VM)的磁碟與 CPU;正式環境每台 VM 各裝一個
      - ./config/grafana/node-web-config.yml:/etc/node-exporter/web-config.yml:ro
      - ./certs:/etc/tls:ro
    pid: host

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest                  # 社群專案(不是 Confluent 或 Prometheus 官方);測試版本 1.10.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    profiles: ["grafana"]
    # 密碼從檔案讀進指令列(不寫在 compose)。連 broker 用 SCRAM 帳號 kafka-exporter(只有 Describe 權限的 ACL);自己的網頁走 HTTPS + mTLS
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec kafka_exporter --kafka.server=broker1:9094 --kafka.server=broker2:9094 --kafka.server=broker3:9094
        --sasl.enabled --sasl.mechanism=scram-sha512 --sasl.username=kafka-exporter --sasl.password="$$(cat /etc/secrets/kafka-exporter.pw)"
        --tls.enabled --tls.ca-file=/etc/tls/ca.pem --tls.server-name=broker1
        --server.tls.enabled --server.tls.cert-file=/etc/tls/server.pem --server.tls.key-file=/etc/tls/server.key
        --server.tls.mutual-auth-enabled --server.tls.ca-file=/etc/tls/ca.pem
        --topic.filter='^[^_].*' --group.filter='.*'
    volumes:
      - ./certs:/etc/tls:ro
      - ./config/grafana/secrets:/etc/secrets:ro

  # ===== 第 27 章:日誌與追蹤(profile observability;用 scripts/observability.sh on 啟動,會先備妥 Kafka 帳號、ACL 與 topic) =====
  loki:
    image: grafana/loki:latest                       # 測試版本 3.7.8
    container_name: loki
    hostname: loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/observability/loki.yml:/etc/loki/loki.yml:ro
      - ./certs:/etc/tls:ro
      - loki-data:/loki
    mem_limit: 384m

  tempo:
    image: grafana/tempo:latest                      # 測試版本 3.0.0
    container_name: tempo
    hostname: tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - ./certs:/etc/tls:ro
      - tempo-data:/var/tempo
    mem_limit: 384m

  alloy:
    image: grafana/alloy:latest                      # 測試版本 1.20.1
    container_name: alloy
    hostname: alloy
    profiles: ["observability"]
    # 密碼從檔案讀進環境變數(sys.env),不寫在 compose;docker.sock 唯讀掛載只為了讀測試容器的日誌(正式環境讀檔案,不需要)
    entrypoint: ["/bin/sh", "-c", "export ALLOY_PRODUCER_PW=$$(cat /etc/secrets/alloy-producer.pw) ALLOY_CONSUMER_PW=$$(cat /etc/secrets/alloy-consumer.pw); exec /bin/alloy run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy"]
    volumes:
      - ./config/observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./config/observability/secrets:/etc/secrets:ro
      - ./certs:/etc/tls:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 512m
    user: "0"

  # ===== 第 29 章:Kafka Connect(profile connect;用 scripts/connect-setup.sh on 啟動,會先備妥 AD 服務帳號、角色與外掛) =====
  connect:
    image: confluentinc/cp-server-connect:8.3.2
    container_name: connect
    hostname: connect
    profiles: ["connect"]
    ports: ["8083:8083"]
    mem_limit: 1280m
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/connect/plugins:/plugins:ro                    # 外掛(connect-file,由 connect-setup.sh 從 Maven Central 下載並校驗 SHA-1)
      - ./config/connect/secrets:/etc/connect-secrets:ro        # 連接器的密碼檔(config provider 讀這裡;正式環境由 CyberArk 提供)
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker1:9094,broker2:9094,broker3:9094
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_LISTENERS: https://0.0.0.0:8083
      CONNECT_REST_ADVERTISED_LISTENER: https
      CONNECT_LISTENERS_HTTPS_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
      CONNECT_LISTENERS_HTTPS_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_LISTENERS_HTTPS_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_LISTENERS_HTTPS_SSL_KEY_PASSWORD: changeit
      CONNECT_PLUGIN_PATH: /plugins,/usr/share/confluent-hub-components   # 只掃外掛目錄:掃 /usr/share/java 全部要數分鐘(實測),轉換器與 provider 本來就在 classpath
      CUB_CLASSPATH: '/usr/share/java/confluent-security/connect/*:/usr/share/java/kafka/*:/usr/share/java/cp-base-new/*'   # 啟動前的 kafka-ready 檢查也要認得 token callback handler(與 Schema Registry 同一個問題)
      # 每個連接器可以用自己的身分連 Kafka(producer.override.* / consumer.override.* / admin.override.*),不必共用 worker 的身分
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      # 連接器設定裡的密碼用 ${file:路徑:鍵} 引用,不把密碼寫進設定(設定會存進 connect-configs topic、也會從 REST 讀得到)
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      # worker 自己的身分:client 憑證(CN=connect)向 MDS 換 token(與 Schema Registry、REST Proxy 同一種做法)
      CONNECT_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_SASL_MECHANISM: OAUTHBEARER
      CONNECT_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      CONNECT_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls=\"https://broker1:8091,https://broker2:8092\";"
      CONNECT_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-connect.keystore.p12
