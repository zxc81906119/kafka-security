# 第 21 章(HA):3 台 controller + 3 台 broker,副本 3、min.insync.replicas 2——與手冊第 1 章「正式環境至少 3 台 controller、副本 3」對應。
# 用法:scripts/ha.sh on   (會清掉資料、以 HA 設定重建;scripts/ha.sh off 回到基礎環境)
# 與基礎環境的差異(只有這些):
#   - controller2、controller3、broker3(設定沿用 controller1 / broker2,只改節點名稱與編號)
#   - quorum 為 3 個 voter(靜態 controller.quorum.voters;正式環境依官方建議用動態 quorum,這裡為了簡化用靜態)
#   - 內部 topic 與預設副本數 3、min.insync.replicas 2
# 注意:HA 模式不要同時開 cyberark、sr 這類額外 profile(記憶體);用完 scripts/ha.sh off。
x-ha-rf: &ha-rf
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_TOPIC_REPLICAS: 3
  KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 3

x-ha-ctrl: &ha-ctrl
  <<: *ha-rf
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
  KAFKA_CONFLUENT_METADATA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
  KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092

# 第 22 章:controller 也把指標送到 Prometheus(KRaft 下 ActiveControllerCount、OfflinePartitionsCount 只有 controller 有)
x-ha-ctrl-telemetry: &ha-ctrl-telemetry
  KAFKA_METRIC_REPORTERS: io.confluent.telemetry.reporter.TelemetryReporter
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: "http"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "true"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL: "https://prometheus:9090/api/v1/otlp"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION: "gzip"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY: "telemetry"            # api.key / api.secret 就是 Prometheus 的 Basic 帳密
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET: "telemetry-pw"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX: "80"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX: "4000"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX: "10"
  KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS: "60000"
  KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE: "io.confluent.kafka.server.controller.(?!.*delta).*|io.confluent.kafka.server.raft.(?!.*delta).*|io.confluent.kafka.server.kafka.controller.(?!.*delta).*"

# 第 22 章:JMX exporter(Prometheus 官方 Java agent)——每個 broker 與 controller 在 7778 埠開 /metrics,供 Prometheus 抓取。
# agent(Maven Central)與各元件的設定檔(Confluent 官方 jmx-monitoring-stacks,釘定 commit 並校驗 SHA-256)由 scripts/jmx-setup.sh 下載到 config/jmx/(scripts/ha.sh on 會自動執行)。
x-ha-jmx-broker: &ha-jmx-broker
  KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_broker_tls.yml"
x-ha-jmx-controller: &ha-jmx-controller
  KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_controller_tls.yml"

services:
  controller1:
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-ctrl, *ha-ctrl-telemetry, *ha-jmx-controller]
  controller2:
    extends: { file: docker-compose.yml, service: controller1 }
    container_name: controller2
    hostname: controller2
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/controller2/9093'"]
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-ctrl, *ha-ctrl-telemetry, *ha-jmx-controller]
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://controller2:9093
  controller3:
    extends: { file: docker-compose.yml, service: controller1 }
    container_name: controller3
    hostname: controller3
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/controller3/9093'"]
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-ctrl, *ha-ctrl-telemetry, *ha-jmx-controller]
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://controller3:9093

  broker1:
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
  broker2:
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
  broker3:
    extends: { file: docker-compose.yml, service: broker2 }
    container_name: broker3
    hostname: broker3
    depends_on:
      controller1: { condition: service_healthy }
      controller2: { condition: service_healthy }
      controller3: { condition: service_healthy }
      openldap: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9094 && exec 3<>/dev/tcp/localhost/8093'"]
    ports: !override
      - "${HOST_PORT_MDS3:-8093}:8093"
      - "${HOST_PORT_BROKER3:-19294}:9094"
    volumes:
      - ./config/jmx:/opt/jmx:ro
    environment:
      <<: [*ha-rf, *ha-jmx-broker]
      KAFKA_NODE_ID: 13
      KAFKA_LISTENERS: INTERNAL://broker3:9092,CLIENT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker3:9092,CLIENT://broker3:9094
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: https://0.0.0.0:8093
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: https://broker3:8093

  # 第 23 章:TLS 憑證到期探測(只在需要時用 --profile c3 一起啟動)
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    profiles: ["c3"]
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--web.config.file=/etc/blackbox/web-config.yml"]
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./config/blackbox/web-config.yml:/etc/blackbox/web-config.yml:ro
      - ./certs/server.pem:/etc/blackbox/server.pem:ro          # blackbox 自己的 HTTPS 憑證(共用 server 憑證,SAN 含 blackbox-exporter)
      - ./certs/server.key:/etc/blackbox/server.key:ro
      - ./certs/ca.pem:/etc/blackbox/ca.pem:ro
      - ./certs/client-legacy-other.pem:/etc/blackbox/probe-client.pem:ro    # 無權限的 client 憑證,只用來完成 mTLS 握手
      - ./certs/client-legacy-other.key:/etc/blackbox/probe-client.key:ro

  # ===== 第 26 章:Grafana 與主機 / consumer lag 指標(profile grafana;用 scripts/grafana.sh on 啟動,會先備妥密碼與帳號) =====
  grafana:
    image: grafana/grafana:latest                     # 測試版本 13.2.3(記錄在 DESIGN-BASIS);正式環境請釘定版本
    container_name: grafana
    hostname: grafana
    profiles: ["grafana"]
    # 啟動前才從密碼檔讀 LDAP bind 密碼進環境變數(ldap.toml 只能展開環境變數);密碼不寫在 compose,docker inspect 看不到
    entrypoint: ["/bin/sh", "-c", "export LDAP_BIND_PW=$$(cat /etc/grafana/secrets/ldap-bind.pw); exec /run.sh"]
    ports: ["3000:3000"]
    environment:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/tls/server.pem
      GF_SERVER_CERT_KEY: /etc/tls/server.key
      GF_SERVER_DOMAIN: localhost
      GF_SECURITY_ADMIN_USER: admin                         # 本機 admin 只留給 break-glass(AD 掛了還能進來),日常用 AD 帳號登入
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/grafana/secrets/admin.pw
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_LDAP_ENABLED: "true"
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"                    # 第一次用 AD 帳號登入時自動建立 Grafana 使用者(角色由群組對映決定)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_METRICS_ENABLED: "true"
      GF_METRICS_BASIC_AUTH_USERNAME: Prometheus
      GF_METRICS_BASIC_AUTH_PASSWORD__FILE: /etc/grafana/secrets/metrics.pw
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - ./config/grafana/secrets:/etc/grafana/secrets:ro
      - ./certs:/etc/tls:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    profiles: ["grafana"]
    command:
      - --path.rootfs=/host
      - --web.config.file=/etc/node-exporter/web-config.yml
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro                                          # 容器環境看到的是 Docker 主機(VM)的磁碟與 CPU;正式環境每台 VM 各裝一個
      - ./config/grafana/node-web-config.yml:/etc/node-exporter/web-config.yml:ro
      - ./certs:/etc/tls:ro
    pid: host

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest                  # 社群專案(不是 Confluent 或 Prometheus 官方);測試版本 1.10.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    profiles: ["grafana"]
    # 密碼從檔案讀進指令列(不寫在 compose)。連 broker 用 SCRAM 帳號 kafka-exporter(只有 Describe 權限的 ACL);自己的網頁走 HTTPS + mTLS
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec kafka_exporter --kafka.server=broker1:9094 --kafka.server=broker2:9094 --kafka.server=broker3:9094
        --sasl.enabled --sasl.mechanism=scram-sha512 --sasl.username=kafka-exporter --sasl.password="$$(cat /etc/secrets/kafka-exporter.pw)"
        --tls.enabled --tls.ca-file=/etc/tls/ca.pem --tls.server-name=broker1
        --server.tls.enabled --server.tls.cert-file=/etc/tls/server.pem --server.tls.key-file=/etc/tls/server.key
        --server.tls.mutual-auth-enabled --server.tls.ca-file=/etc/tls/ca.pem
        --topic.filter='^[^_].*' --group.filter='.*'
    volumes:
      - ./certs:/etc/tls:ro
      - ./config/grafana/secrets:/etc/secrets:ro
