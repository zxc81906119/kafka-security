# 實驗:3 個 KRaft controller 之間用 SASL/PLAIN(靜態帳號)能否組成 quorum(只測機制,不含 RBAC / TLS)
# 用法: docker compose -p mctest up -d ; docker exec mc-broker kafka-metadata-quorum --bootstrap-server localhost:9092 describe --status ; docker compose -p mctest down -v
x-ctl: &ctl
  image: confluentinc/cp-server:8.3.2
  environment: &ctl-env
    CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
    KAFKA_PROCESS_ROLES: controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@mc-c1:9093,2@mc-c2:9093,3@mc-c3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT
    KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
    KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
    KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="kafka-controller" password="controller-secret"
      user_kafka-controller="controller-secret"
      user_kafka-broker="broker-secret";
    KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
services:
  mc-c1:
    <<: *ctl
    container_name: mc-c1
    hostname: mc-c1
    environment: { <<: *ctl-env, KAFKA_NODE_ID: 1, KAFKA_LISTENERS: "CONTROLLER://mc-c1:9093" }
  mc-c2:
    <<: *ctl
    container_name: mc-c2
    hostname: mc-c2
    environment: { <<: *ctl-env, KAFKA_NODE_ID: 2, KAFKA_LISTENERS: "CONTROLLER://mc-c2:9093" }
  mc-c3:
    <<: *ctl
    container_name: mc-c3
    hostname: mc-c3
    environment: { <<: *ctl-env, KAFKA_NODE_ID: 3, KAFKA_LISTENERS: "CONTROLLER://mc-c3:9093" }
  mc-broker:
    image: confluentinc/cp-server:8.3.2
    container_name: mc-broker
    hostname: mc-broker
    depends_on: [mc-c1, mc-c2, mc-c3]
    environment:
      CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
      KAFKA_NODE_ID: 11
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@mc-c1:9093,2@mc-c2:9093,3@mc-c3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://mc-broker:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://mc-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="kafka-broker" password="broker-secret";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
