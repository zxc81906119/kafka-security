# 憑證更換實驗:單節點 KRaft,對外 SSL listener(要求 client 憑證),可動態換 keystore / truststore
# 用法:bash run.sh(產憑證 → 啟動 → 跑完所有情境 → 結果寫入 evidence.log)
services:
  kafka:
    image: confluentinc/cp-server:8.3.2
    container_name: cr-kafka
    hostname: kafka
    volumes:
      - ./work:/certs:ro
      - ./work:/etc/kafka/secrets:ro
    environment:
      CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INTERNAL://kafka:9092,SSL://kafka:9093,CONTROLLER://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,SSL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,SSL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SSL_KEYSTORE_FILENAME: S1.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: creds
      KAFKA_SSL_KEY_CREDENTIALS: creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: ts_srv_A.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: creds
      KAFKA_LISTENER_NAME_SSL_SSL_KEYSTORE_LOCATION: /certs/S1.p12
      KAFKA_LISTENER_NAME_SSL_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_LISTENER_NAME_SSL_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_LISTENER_NAME_SSL_SSL_KEY_PASSWORD: changeit
      KAFKA_LISTENER_NAME_SSL_SSL_TRUSTSTORE_LOCATION: /certs/ts_srv_A.p12
      KAFKA_LISTENER_NAME_SSL_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_LISTENER_NAME_SSL_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_LISTENER_NAME_SSL_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
