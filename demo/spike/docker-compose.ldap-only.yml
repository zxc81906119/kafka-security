# Demo: Confluent Platform 8.3 (KRaft) + MDS RBAC + LDAP(模擬 AD) + 共用單一 server 憑證
# 啟動請用 scripts/up.sh(需先產生憑證、設定 license 試用)。
name: cpsec

x-common-ssl: &common-ssl
  KAFKA_SSL_KEYSTORE_FILENAME: server.keystore.p12
  KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
  KAFKA_SSL_KEY_CREDENTIALS: sslkey_creds
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_OPTS: "-Ddemo.cpsec=1"
  KAFKA_CONFLUENT_BALANCER_ENABLE: "false"
  KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_SSL_CLIENT_AUTH: none
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https

x-broker-env: &broker-env
  <<: *common-ssl
  CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_SSL,INTERNAL:SASL_SSL,CLIENT:SASL_SSL,TOKEN:SASL_SSL
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  # --- 內部通道:CONTROLLER = SASL/PLAIN(靜態帳號,無 LDAP callback);INTERNAL = SASL/SCRAM-SHA-512 ---
  KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
  KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="kafka-broker" password="broker-secret";
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
  KAFKA_LISTENER_NAME_INTERNAL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
  KAFKA_LISTENER_NAME_INTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="kafka-broker" password="broker-secret";
  # --- CLIENT listener:人 = PLAIN + LDAP;服務 = SCRAM ---
  KAFKA_LISTENER_NAME_CLIENT_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
  KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.security.auth.provider.ldap.LdapAuthenticateCallbackHandler
  KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required;
  KAFKA_LISTENER_NAME_CLIENT_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
  # --- TOKEN listener:MDS 簽發的 token(C3 / REST Proxy 代表使用者、人用 confluent login 的腳本) ---
  KAFKA_LISTENER_NAME_TOKEN_SASL_ENABLED_MECHANISMS: OAUTHBEARER
  KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerValidatorCallbackHandler
  KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
  KAFKA_LISTENER_NAME_TOKEN_OAUTHBEARER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required publicKeyPath="/etc/kafka/secrets/public.pem";
  # --- 授權 ---
  KAFKA_AUTHORIZER_CLASS_NAME: io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
  KAFKA_CONFLUENT_AUTHORIZER_ACCESS_RULE_PROVIDERS: CONFLUENT,KRAFT_ACL
  KAFKA_SUPER_USERS: User:kafka-broker;User:kafka-controller;User:bootstrap;User:gary
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  # --- 副本數(只有 2 個 broker) ---
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_TOPIC_REPLICAS: 2
  KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_CONFLUENT_REPORTERS_TELEMETRY_AUTO_ENABLE: "false"
  # --- MDS:token ---
  KAFKA_CONFLUENT_METADATA_SERVER_AUTHENTICATION_METHOD: BEARER
  KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_KEY_PATH: /etc/kafka/secrets/keypair.pem
  KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_MAX_LIFETIME_MS: 3600000
  KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_SIGNATURE_ALGORITHM: RS256
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEYSTORE_PASSWORD: changeit
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEY_PASSWORD: changeit
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_TRUSTSTORE_PASSWORD: changeit
  # --- LDAP(模擬 AD):bind DN 唯讀查詢帳號 + 以群組成員屬性對映 ---
  KAFKA_LDAP_JAVA_NAMING_FACTORY_INITIAL: com.sun.jndi.ldap.LdapCtxFactory
  KAFKA_LDAP_COM_SUN_JNDI_LDAP_READ_TIMEOUT: 3000
  KAFKA_LDAP_JAVA_NAMING_PROVIDER_URL: ldap://openldap:389
  KAFKA_LDAP_JAVA_NAMING_SECURITY_PRINCIPAL: cn=svc-kafka-ldap,ou=system,dc=corp,dc=demo
  KAFKA_LDAP_JAVA_NAMING_SECURITY_CREDENTIALS: ldap-bind-pw
  KAFKA_LDAP_JAVA_NAMING_SECURITY_AUTHENTICATION: simple
  KAFKA_LDAP_SEARCH_MODE: GROUPS
  KAFKA_LDAP_GROUP_SEARCH_BASE: ou=groups,dc=corp,dc=demo
  KAFKA_LDAP_GROUP_OBJECT_CLASS: groupOfNames
  KAFKA_LDAP_GROUP_NAME_ATTRIBUTE: cn
  KAFKA_LDAP_GROUP_MEMBER_ATTRIBUTE: member
  KAFKA_LDAP_GROUP_MEMBER_ATTRIBUTE_PATTERN: uid=(.*),ou=users,dc=corp,dc=demo
  KAFKA_LDAP_USER_SEARCH_BASE: ou=users,dc=corp,dc=demo
  KAFKA_LDAP_USER_OBJECT_CLASS: inetOrgPerson
  KAFKA_LDAP_USER_NAME_ATTRIBUTE: uid
  KAFKA_LDAP_REFRESH_INTERVAL_MS: 5000
  KAFKA_PASSWORD_ENCODER_SECRET: encoder-secret

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: openldap
    environment:
      LDAP_ORGANISATION: "Corp Demo"
      LDAP_DOMAIN: "corp.demo"
      LDAP_BASE_DN: "dc=corp,dc=demo"
      LDAP_ADMIN_PASSWORD: adminpw
      LDAP_TLS: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service
    ports:
      - "389:389"

  ldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: ldapadmin
    hostname: ldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on: [openldap]

  controller1:
    image: confluentinc/cp-server:8.3.2
    container_name: controller1
    hostname: controller1
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/ensure-controller.sh:/etc/confluent/docker/ensure:ro
    environment:
      <<: *common-ssl
      CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093
      KAFKA_LISTENERS: CONTROLLER://controller1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_SSL
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="kafka-controller" password="controller-secret"
        user_kafka-controller="controller-secret"
        user_kafka-broker="broker-secret";
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:kafka-broker;User:kafka-controller
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # 啟動前預建 broker↔broker 用的 SCRAM 憑證(見 ensure-controller.sh)
      SCRAM_BOOTSTRAP: "SCRAM-SHA-512=[name=kafka-broker,password=broker-secret]"

  broker1:
    image: confluentinc/cp-server:8.3.2
    container_name: broker1
    hostname: broker1
    depends_on: [controller1, openldap]
    volumes:
      - ./certs:/etc/kafka/secrets:ro
    ports:
      - "8091:8091"
      - "9094:9094"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 11
      KAFKA_LISTENERS: INTERNAL://broker1:9092,CLIENT://0.0.0.0:9094,TOKEN://broker1:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:9092,CLIENT://broker1:9094,TOKEN://broker1:9095
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: https://0.0.0.0:8091
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: https://broker1:8091

  broker2:
    image: confluentinc/cp-server:8.3.2
    container_name: broker2
    hostname: broker2
    depends_on: [controller1, openldap]
    volumes:
      - ./certs:/etc/kafka/secrets:ro
    ports:
      - "8092:8092"
      - "9194:9194"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 12
      KAFKA_LISTENERS: INTERNAL://broker2:9092,CLIENT://0.0.0.0:9194,TOKEN://broker2:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:9092,CLIENT://broker2:9194,TOKEN://broker2:9095
      KAFKA_CONFLUENT_METADATA_SERVER_LISTENERS: https://0.0.0.0:8092
      KAFKA_CONFLUENT_METADATA_SERVER_ADVERTISED_LISTENERS: https://broker2:8092
