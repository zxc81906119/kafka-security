worker_processes 1;
events {}

# ── L4:TCP 透傳(對應 F5 的 Performance (Layer 4) / FastL4 虛擬伺服器):TLS 不在 LB 終止 ──
stream {
  server { listen 9443; proxy_pass restproxy:8086; }
  server { listen 9091; proxy_pass broker1:8091; }      # MDS 也走 L4 透傳
}

http {
  access_log /dev/stdout;
  proxy_ssl_session_reuse off;                 # 實驗需要:不同 server 區塊共用同一個 upstream,session 復用會讓後端沿用先前連線的憑證身分(見 FINDINGS)
  ssl_certificate     /certs/server.pem;
  ssl_certificate_key /certs/server.key;
  ssl_client_certificate /certs/ca.pem;
  ssl_verify_client optional;                 # LB 自己驗 client 憑證(簽發者必須是客戶 CA),但不一定轉給後端

  # ── L7-A:LB 終止 TLS,連後端時不帶任何憑證(F5 Client SSL profile + 預設 Server SSL profile)──
  server {
    listen 9444 ssl;
    location / {
      proxy_pass https://restproxy:8086;
      proxy_ssl_trusted_certificate /certs/ca.pem; proxy_ssl_verify on; proxy_ssl_name restproxy;
    }
  }

  # ── L7-B:LB 終止 TLS,把 client 憑證資訊放進 header 轉給後端(F5 iRule 常見做法)──
  server {
    listen 9445 ssl;
    location / {
      proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
      proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
      proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;
      proxy_pass https://restproxy:8086;
      proxy_ssl_trusted_certificate /certs/ca.pem; proxy_ssl_verify on; proxy_ssl_name restproxy;
    }
  }

  # ── L7-C:LB 用「一張固定的 client 憑證」連後端(有人想用這個辦法讓 REST Proxy 認得 LB)──
  server {
    listen 9446 ssl;
    location / {
      proxy_pass https://restproxy:8086;
      proxy_ssl_certificate     /certs/client-legacy-orders.pem;
      proxy_ssl_certificate_key /certs/client-legacy-orders.key;
      proxy_ssl_trusted_certificate /certs/ca.pem; proxy_ssl_verify on; proxy_ssl_name restproxy;
    }
  }

  # ── MDS 經 L7 終止 TLS(REST Proxy 到 MDS 這段若放在這種 LB 後面)──
  server {
    listen 9092 ssl;
    location / {
      proxy_pass https://broker1:8091;
      proxy_ssl_trusted_certificate /certs/ca.pem; proxy_ssl_verify on; proxy_ssl_name broker1;
    }
  }
}
