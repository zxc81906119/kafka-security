  restproxy1:
    image: confluentinc/cp-kafka-rest:8.3.2
    container_name: restproxy1
    hostname: restproxy1
    profiles: ["restproxy", "full"]
    depends_on:
      broker1: { condition: service_healthy }
      broker2: { condition: service_healthy }
      broker3: { condition: service_healthy }
      broker4: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/8086'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/jmx:/opt/jmx:ro
    environment:
      # JMX exporter(官方 jmx-monitoring-stacks 的 confluent_rest.yml + HTTPS + Basic;scripts/jmx-setup.sh 產生),7778 埠供 Prometheus 抓取
      KAFKAREST_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/confluent_rest_tls.yml"
      KAFKA_REST_HOST_NAME: restproxy1
      KAFKA_REST_ID: restproxy1                # 官方:多實例每台 id 必須唯一(預設空值在多台時不安全)
      KAFKA_REST_LISTENERS: https://0.0.0.0:8086
      KAFKA_REST_BOOTSTRAP_SERVERS: SASL_SSL://broker1:9094,SASL_SSL://broker2:9094,SASL_SSL://broker3:9094,SASL_SSL://broker4:9094
      # REST Proxy 對外 HTTPS:共用 server 憑證
      KAFKA_REST_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
      KAFKA_REST_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_REST_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_REST_SSL_KEY_PASSWORD: changeit
      KAFKA_REST_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_REST_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_REST_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_REST_SSL_CLIENT_AUTHENTICATION: "REQUESTED"
      # 連 broker 的 Kafka client:CLIENT listener(全部用 OAUTHBEARER:代表使用者/機器的請求帶該主體的 token;REST Proxy 自身用 CN=restproxy 憑證換的 token)
      KAFKA_REST_CLIENT_SECURITY_PROTOCOL: SASL_SSL
      # REST Proxy 自身(license 檢查、kafka-ready 健康檢查)用 client 憑證(CN=restproxy)向 MDS 換 token,以 OAUTHBEARER 連 broker(官方 mTLS RBAC 範例做法);代表使用者的請求改用該使用者的 MDS token
      KAFKA_REST_CLIENT_SASL_MECHANISM: OAUTHBEARER
      KAFKA_REST_CLIENT_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      KAFKA_REST_CLIENT_SASL_JAAS_CONFIG: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094";
      KAFKA_REST_CLIENT_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-restproxy.keystore.p12
      KAFKA_REST_CLIENT_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_REST_CLIENT_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_REST_CLIENT_SSL_KEY_PASSWORD: changeit
      KAFKA_REST_CLIENT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_REST_CLIENT_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_REST_CLIENT_SSL_TRUSTSTORE_PASSWORD: changeit
      # RBAC + principal propagation(使用者以 Basic 進入,MDS 驗證後以其身分連 Kafka)
      KAFKA_REST_KAFKA_REST_RESOURCE_EXTENSION_CLASS: io.confluent.kafkarest.security.KafkaRestSecurityResourceExtension
      KAFKA_REST_REST_SERVLET_INITIALIZOR_CLASSES: io.confluent.common.security.jetty.initializer.AuthenticationHandler
      KAFKA_REST_AUTH_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^.*CN=([^,]*).*$$/$$1/,DEFAULT"
      KAFKA_REST_PUBLIC_KEY_PATH: /etc/kafka/secrets/public.pem
      # REST Proxy 自身向 MDS 認證:mTLS(CN=restproxy),不是 AD 帳號
      KAFKA_REST_CONFLUENT_METADATA_BOOTSTRAP_SERVER_URLS: https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094
      KAFKA_REST_CONFLUENT_METADATA_SERVER_URLS_MAX_AGE_MS: 60000
      KAFKA_REST_CONFLUENT_METADATA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-restproxy.keystore.p12
      KAFKA_REST_CONFLUENT_METADATA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_REST_CONFLUENT_METADATA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_REST_CONFLUENT_METADATA_SSL_KEY_PASSWORD: changeit
      KAFKA_REST_CONFLUENT_METADATA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_REST_CONFLUENT_METADATA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_REST_CONFLUENT_METADATA_SSL_TRUSTSTORE_PASSWORD: changeit
      CUB_CLASSPATH: '/usr/share/java/confluent-security/kafka-rest/*:/usr/share/java/kafka-rest/*:/usr/share/java/cp-base-new/*'

  restproxy2:
    extends: { service: restproxy1 }
    container_name: restproxy2
    hostname: restproxy2
    environment:
      KAFKA_REST_HOST_NAME: restproxy2
      KAFKA_REST_ID: restproxy2

  # F5 的替身:L4(TCP)透傳,後面兩台 REST Proxy。client 憑證(mTLS)要走到 REST Proxy 本身,所以不能在這裡終止 TLS。
  # 客戶端一律連這個名稱(restproxy:8086);壞一台時 nginx 的被動健康檢查把它移出。正式環境換成 F5 的 L4 virtual server。
  restproxy:
    image: nginx:stable
    container_name: restproxy
    hostname: restproxy
    profiles: ["restproxy", "full"]
    depends_on:
      restproxy1: { condition: service_healthy }
      restproxy2: { condition: service_healthy }
    volumes:
      - ./config/lb/restproxy-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HOST_PORT_RESTPROXY:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/8086'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 5s

  # ---------------- 第 20 章:Schema Registry(RBAC)+ 欄位級加密(CSFLE) ----------------
  schema-registry1:
    image: confluentinc/cp-schema-registry:8.3.2
    container_name: schema-registry1
    hostname: schema-registry1
    profiles: ["sr", "full"]
    # 服務名稱 schema-registry 由兩台共用(Docker DNS 輪詢,代替正式環境前端的 F5 VIP);schema-registry2 經 extends 一併繼承
    networks:
      default:
        aliases: [schema-registry]
    depends_on:
      broker1: { condition: service_healthy }
      broker2: { condition: service_healthy }
      broker3: { condition: service_healthy }
      broker4: { condition: service_healthy }
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/jmx:/opt/jmx:ro
    ports:
      - "${HOST_PORT_SR:-8085}:8081"       # 主機 8081 已被 phpLDAPadmin 使用
    environment:
      # JMX exporter(官方 jmx-monitoring-stacks 的 confluent_schemaregistry.yml + HTTPS + Basic;scripts/jmx-setup.sh 產生),7778 埠供 Prometheus 抓取
      SCHEMA_REGISTRY_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/confluent_schemaregistry_tls.yml"
      SCHEMA_REGISTRY_HOST_NAME: schema-registry1
      SCHEMA_REGISTRY_LISTENERS: https://0.0.0.0:8081
      SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: https      # 只開 HTTPS 時必設,否則啟動失敗:No listener configured with requested scheme http
      # 對外 HTTPS:共用 server 憑證(SAN 含 schema-registry)
      SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
      SCHEMA_REGISTRY_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD: changeit
      SCHEMA_REGISTRY_SSL_KEY_PASSWORD: changeit
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: changeit
      # 連 broker(_schemas topic):與 REST Proxy 相同做法——client 憑證(CN=schema-registry)向 MDS 換 token,OAUTHBEARER
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_SSL://broker1:9094,SASL_SSL://broker2:9094,SASL_SSL://broker3:9094,SASL_SSL://broker4:9094
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_SSL
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: OAUTHBEARER
      SCHEMA_REGISTRY_KAFKASTORE_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094";
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-schema-registry.keystore.p12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_PASSWORD: changeit
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEY_PASSWORD: changeit
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_PASSWORD: changeit
      # RBAC:使用者以 Basic(AD 帳密)或 Bearer(MDS token)進來,授權交給 MDS
      SCHEMA_REGISTRY_RESOURCE_EXTENSION_CLASS: io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension,io.confluent.dekregistry.DekRegistryResourceExtension,io.confluent.kafka.schemaregistry.rulehandler.RuleSetResourceExtension   # DekRegistry = KEK / DEK 管理(沒加時 /dek-registry/v1/* 回 404);RuleSetResource = 資料合約的 ruleSet(沒加時註冊 schema 會默默丟掉 ruleSet,不報錯)。舊註解: 後者 = DEK Registry(欄位級加密的 KEK / DEK 管理);沒加時 /dek-registry/v1/* 回 404
      SCHEMA_REGISTRY_CONFLUENT_SCHEMA_REGISTRY_AUTHORIZER_CLASS: io.confluent.kafka.schemaregistry.security.authorizer.rbac.RbacAuthorizer
      # 認證:同時接受「client 憑證(mTLS)」與「Token / AD 帳密」(InstallCompositeSecurityHandler)。
      #   原因:C3 對 SR 的健康檢查固定打 / 且不帶使用者身分,只帶 client 憑證(CN=c3,C3 端以 alias.name 指定);若只用 InstallBearerOrBasicSecurityHandler(官方 RBAC 範例)會 401,
      #   C3 就判定 SR 全掛。使用者經 C3 的操作仍帶各自的 token(實測 gary 5 / yujie 1 / ming 0 個 subject)。
      #   注意:這個 initializer 存在於官方安全外掛,但 SR 文件未寫 → 已列 CONFLUENT-QUESTIONS 確認支援範圍。
      SCHEMA_REGISTRY_REST_SERVLET_INITIALIZOR_CLASSES: io.confluent.common.security.jetty.initializer.InstallCompositeSecurityHandler
      SCHEMA_REGISTRY_SSL_CLIENT_AUTHENTICATION: REQUESTED   # 有帶 client 憑證就驗(必須是行內 CA 簽的),沒帶照常走 Token / 帳密
      SCHEMA_REGISTRY_AUTH_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=([a-zA-Z0-9.-]*).*$$/$$1/,DEFAULT   # 憑證主體取 CN(CN=c3 → c3;沒有任何 SR 角色)
      SCHEMA_REGISTRY_CONFLUENT_SCHEMA_REGISTRY_AUTH_MECHANISM: JETTY_AUTH
      SCHEMA_REGISTRY_DEK_REGISTRY_RBAC_ENABLE: "true"     # 沒設時 DEK Registry 的 KEK 端點對所有人 403(日誌:Couldn't find a corresponding operation to authorize);設了才依 Kek:<名稱> 的 role 授權
      SCHEMA_REGISTRY_PUBLIC_KEY_PATH: /etc/kafka/secrets/public.pem
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: schema-registry
      SCHEMA_REGISTRY_CONFLUENT_METADATA_BOOTSTRAP_SERVER_URLS: https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SERVER_URLS_MAX_AGE_MS: 60000
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-schema-registry.keystore.p12
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_KEYSTORE_PASSWORD: changeit
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_KEY_PASSWORD: changeit
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_CONFLUENT_METADATA_SSL_TRUSTSTORE_PASSWORD: changeit
      CUB_CLASSPATH: '/usr/share/java/confluent-security/schema-registry/*:/usr/share/java/schema-registry/*:/usr/share/java/cp-base-new/*'


  schema-registry2:
    extends: { service: schema-registry1 }
    container_name: schema-registry2
    hostname: schema-registry2
    # extends 會把 schema-registry1 的 ports 合併進來(兩台搶 8085,實測:driver failed programming external connectivity);!override 改成只用自己的埠
    ports: !override
      - "${HOST_PORT_SR2:-8185}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry2

  # ---------------- Control Center (next-gen 2.x) + Prometheus + Alertmanager ----------------
  prometheus:
    image: confluentinc/cp-enterprise-prometheus:2.6.1
    container_name: prometheus
    hostname: prometheus
    profiles: ["c3", "full"]
    volumes:
      - ./config/c3:/mnt/config
      - ./certs:/etc/tls:ro        # web-config-prom.yml 的 TLS 憑證(共用 server 憑證)
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: "false"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 第 34 章:外部看門狗(dead man's switch)。Alertmanager 每分鐘送 Watchdog 心跳來,超過 TIMEOUT_SEC 沒收到就判定「監控鏈路失效」。
  #   代表行內既有的企業監控平台(正式環境接那個平台,不部署這個容器)。用 scripts/watchdog-setup.sh on 啟動。
  watchdog:
    image: python:3-alpine                              # 測試時本機已有的版本;只用標準函式庫
    container_name: watchdog
    hostname: watchdog
    profiles: ["watchdog"]
    command: ["python3", "/app/deadman.py"]
    environment:
      TIMEOUT_SEC: "180"                                # Alertmanager 每 60 秒重送一次,容許漏 2 次
      USER_FILE: /etc/watchdog/user
      TLS_CERT: /etc/tls/server.pem
      TLS_KEY: /etc/tls/server.key
    volumes:
      - ./config/watchdog/deadman.py:/app/deadman.py:ro
      - ./config/watchdog/secrets:/etc/watchdog:ro
      - ./certs:/etc/tls:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 9443), 2)\""]
      interval: 10s
      timeout: 5s
      retries: 6

  # 第 30 章:測試用的郵件伺服器(收告警信、有網頁可看)。正式環境是行內自架的郵件伺服器;這裡用 Mailpit 代替,
  # SMTP 啟用 STARTTLS 並強制、要帳密;網頁與 API 走 HTTPS + Basic。用 scripts/mail-setup.sh on 啟動。
  mailpit:
    image: axllent/mailpit:latest                      # 測試版本 1.31.4
    container_name: mailpit
    hostname: mailpit
    profiles: ["mail"]
    ports: ["8025:8025"]
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_SMTP_TLS_CERT: /etc/tls/server.pem
      MP_SMTP_TLS_KEY: /etc/tls/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_FILE: /etc/mail/smtp-auth
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_UI_TLS_CERT: /etc/tls/server.pem
      MP_UI_TLS_KEY: /etc/tls/server.key
      MP_UI_AUTH_FILE: /etc/mail/ui-auth
      MP_MAX_MESSAGES: "500"
    volumes:
      - ./certs:/etc/tls:ro
      - ./config/mail:/etc/mail:ro
    mem_limit: 128m

  alertmanager:
    image: confluentinc/cp-enterprise-alertmanager:2.6.1
    container_name: alertmanager
    hostname: alertmanager
    profiles: ["c3", "full"]
    depends_on:
      prometheus: { condition: service_healthy }
    volumes:
      - ./config/c3:/mnt/config
      - ./certs:/etc/tls:ro        # web-config-am.yml 的 TLS 憑證
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: "false"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9093'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  control-center:
    image: confluentinc/cp-enterprise-control-center-next-gen:2.6.1
    container_name: control-center
    hostname: control-center
    profiles: ["c3", "full"]
    depends_on:
      broker1: { condition: service_healthy }
      broker2: { condition: service_healthy }
      broker3: { condition: service_healthy }
      broker4: { condition: service_healthy }
      prometheus: { condition: service_healthy }
      alertmanager: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9021'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/c3:/mnt/config
    # 只對外開 HTTPS 9022;HTTP 9021 留在容器內給健康檢查(正式環境不要開 HTTP)
    ports:
      - "${HOST_PORT_C3_2:-9022}:9022"
    environment:
      PORT: 9021
      CONTROL_CENTER_BOOTSTRAP_SERVERS: SASL_SSL://broker1:9094,SASL_SSL://broker2:9094,SASL_SSL://broker3:9094,SASL_SSL://broker4:9094
      CONTROL_CENTER_REPLICATION_FACTOR: 3
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONTROL_CENTER_METRICS_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 3
      CONTROL_CENTER_STREAMS_NUM_STREAM_THREADS: 1
      # C3 自身連 Kafka(Streams):RBAC 下僅支援 OAUTHBEARER → 以 client 憑證(CN=c3)向 MDS 取 token,免 AD 帳號、免密碼
      CONTROL_CENTER_STREAMS_SECURITY_PROTOCOL: SASL_SSL
      CONTROL_CENTER_STREAMS_SASL_MECHANISM: OAUTHBEARER
      CONTROL_CENTER_STREAMS_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      CONTROL_CENTER_STREAMS_SASL_JAAS_CONFIG: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094";
      CONTROL_CENTER_STREAMS_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-c3.keystore.p12
      CONTROL_CENTER_STREAMS_SSL_KEYSTORE_TYPE: PKCS12
      CONTROL_CENTER_STREAMS_SSL_KEYSTORE_PASSWORD: changeit
      CONTROL_CENTER_STREAMS_SSL_KEY_PASSWORD: changeit
      CONTROL_CENTER_STREAMS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONTROL_CENTER_STREAMS_SSL_TRUSTSTORE_TYPE: PKCS12
      CONTROL_CENTER_STREAMS_SSL_TRUSTSTORE_PASSWORD: changeit
      # C3 UI(HTTPS):共用 server 憑證
      CONTROL_CENTER_REST_LISTENERS: http://0.0.0.0:9021,https://0.0.0.0:9022
      CONTROL_CENTER_REST_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
      CONTROL_CENTER_REST_SSL_KEYSTORE_TYPE: PKCS12
      CONTROL_CENTER_REST_SSL_KEYSTORE_PASSWORD: changeit
      CONTROL_CENTER_REST_SSL_KEY_PASSWORD: changeit
      CONTROL_CENTER_REST_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONTROL_CENTER_REST_SSL_TRUSTSTORE_TYPE: PKCS12
      CONTROL_CENTER_REST_SSL_TRUSTSTORE_PASSWORD: changeit
      # RBAC:使用者以 AD 帳號(經 MDS)登入;C3 自身向 MDS 以 mTLS(CN=c3)認證
      CONTROL_CENTER_REST_AUTHENTICATION_METHOD: BEARER
      # Schema Registry 2 台:兩台都列出。使用者在 C3 的操作以自己的 token 轉送,授權由 MDS 判斷(實測 gary 5 / yujie 1 / ming 0 個 subject)。
      #   C3 自己的背景健康檢查(固定打 SR 的 /,沒有使用者身分)以 C3 的 client 憑證通過:keystore 放 client-c3,
      #   alias.name 指定用 c3(官方設定;沒指定時 C3 會拿自己對外 HTTPS 的 server 憑證去連,實測)。SR 端見 InstallCompositeSecurityHandler。
      CONTROL_CENTER_SCHEMA_REGISTRY_ENABLE: "true"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: https://schema-registry1:8081,https://schema-registry2:8081
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: changeit
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-c3.keystore.p12
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_SSL_KEYSTORE_TYPE: PKCS12
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD: changeit
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_SSL_KEY_PASSWORD: changeit
      CONTROL_CENTER_SCHEMA_REGISTRY_SCHEMA_REGISTRY_ALIAS_NAME: c3
      # Connect 2 台:兩台都列出(官方:C3 用其中一台,失敗時改試另一台)。健康檢查打 /v1/metadata/id(不需認證),使用者的操作以自己的 token 轉送
      CONTROL_CENTER_CONNECT_CONNECT_CLUSTER: https://connect1:8083,https://connect2:8083   # confluent.controlcenter.connect.<名稱>.cluster;名稱取 connect
      CONTROL_CENTER_CONNECT_CONNECT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONTROL_CENTER_CONNECT_CONNECT_SSL_TRUSTSTORE_PASSWORD: changeit
      PUBLIC_KEY_PATH: /etc/kafka/secrets/public.pem
      CONFLUENT_METADATA_BOOTSTRAP_SERVER_URLS: https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094
      CONFLUENT_METADATA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-c3.keystore.p12
      CONFLUENT_METADATA_SSL_KEYSTORE_TYPE: PKCS12
      CONFLUENT_METADATA_SSL_KEYSTORE_PASSWORD: changeit
      CONFLUENT_METADATA_SSL_KEY_PASSWORD: changeit
      CONFLUENT_METADATA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONFLUENT_METADATA_SSL_TRUSTSTORE_TYPE: PKCS12
      CONFLUENT_METADATA_SSL_TRUSTSTORE_PASSWORD: changeit
      CONTROL_CENTER_STREAMS_CPREST_URL: https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094
      # Prometheus / Alertmanager
      CONTROL_CENTER_PROMETHEUS_ENABLE: "true"
      CONTROL_CENTER_PROMETHEUS_URL: https://prometheus:9090
      CONTROL_CENTER_PROMETHEUS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONTROL_CENTER_PROMETHEUS_SSL_TRUSTSTORE_PASSWORD: changeit
      CONTROL_CENTER_PROMETHEUS_BASIC_AUTH_USER_INFO: c3:prom-pw
      CONTROL_CENTER_PROMETHEUS_RULES_FILE: /mnt/config/trigger_rules-generated.yml
      CONTROL_CENTER_ALERTMANAGER_URL: https://alertmanager:9093
      CONTROL_CENTER_ALERTMANAGER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONTROL_CENTER_ALERTMANAGER_SSL_TRUSTSTORE_PASSWORD: changeit
      CONTROL_CENTER_ALERTMANAGER_BASIC_AUTH_USER_INFO: c3:am-pw
      CONTROL_CENTER_ALERTMANAGER_CONFIG_FILE: /mnt/config/alertmanager-generated.yml
      CUB_CLASSPATH: '/usr/share/java/confluent-control-center/*:/usr/share/java/rest-utils/*:/usr/share/java/confluent-common/*:/usr/share/java/confluent-security/kafka-rest/*:/usr/share/java/kafka-rest/:/usr/share/java/cp-base-new/*'

  # ---------------- CyberArk Conjur OSS(模擬行內 CyberArk 的「應用程式取密碼」;profile cyberark) ----------------
  # 用法:bash scripts/conjur.sh up   # 產生 data key、啟動、建立帳戶、載入 policy(config/conjur/policy/kafka.yml)
  conjur-db:
    image: postgres:15
    container_name: conjur-db
    hostname: conjur-db
    profiles: ["cyberark"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: password
      POSTGRES_PASSWORD: conjur-db-pw        # demo 測試值
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  conjur-server:
    image: cyberark/conjur:latest
    container_name: conjur-server
    hostname: conjur-server
    profiles: ["cyberark"]
    command: server
    depends_on:
      conjur-db: { condition: service_healthy }
    env_file:
      - config/conjur/conjur.env             # CONJUR_DATA_KEY(由 scripts/conjur.sh up 產生;不進版本庫)
    environment:
      DATABASE_URL: postgres://postgres:conjur-db-pw@conjur-db/postgres
      CONJUR_AUTHENTICATORS: authn
      CONJUR_TELEMETRY_ENABLED: "false"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ >/dev/null || curl -s http://localhost/ | grep -qi conjur"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  conjur:                                    # TLS 入口:共用 server 憑證(SAN 含 conjur),應用程式與 OP menu 都連 https://conjur
    image: nginx:stable
    container_name: conjur
    hostname: conjur
    profiles: ["cyberark"]
    depends_on:
      conjur-server: { condition: service_healthy }
    volumes:
      - ./config/conjur/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost/ -o /dev/null || true"]
      interval: 10s
      timeout: 5s
      retries: 6

  conjur-cli:                                # 管理用(載入 policy、設定秘密);正式環境是 CyberArk 管理員在 PVWA / CLI 做
    image: cyberark/conjur-cli:9
    container_name: conjur-cli
    hostname: conjur-cli
    profiles: ["cyberark"]
    entrypoint: sleep
    command: infinity
    depends_on:
      conjur: { condition: service_started }
    volumes:
      - ./config/conjur/policy:/policy:ro
      - ./certs/ca.pem:/etc/ssl/certs/demo-ca.pem:ro

  # ---------------- 以下原放在 HA 覆蓋檔(現在合併為單一檔案)----------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    hostname: minio
    profiles: ["tier"]
    command: server /data --console-address :9001 --certs-dir /certs
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER_FILE: /run/tier/root-user
      MINIO_ROOT_PASSWORD_FILE: /run/tier/root-password
      MINIO_KMS_SECRET_KEY_FILE: /run/tier/kms-key     # 測試用靜態金鑰,讓 MinIO 接受伺服器端加密(Kafka 預設 AES256);正式環境用 KES + 行內 KMS/HSM
    volumes:
      - minio-data:/data
      - ./config/tier/certs:/certs:ro
      - ./config/tier/secrets:/run/tier:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:9000/minio/health/live"]     # 本機探測,不驗證憑證(只問「活著嗎」)
      interval: 10s
      timeout: 5s
      retries: 12

  # 第 23 章:TLS 憑證到期探測(只在需要時用 --profile c3 一起啟動)
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    profiles: ["c3"]
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--web.config.file=/etc/blackbox/web-config.yml"]
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./config/blackbox/web-config.yml:/etc/blackbox/web-config.yml:ro
      - ./certs/server.pem:/etc/blackbox/server.pem:ro          # blackbox 自己的 HTTPS 憑證(共用 server 憑證,SAN 含 blackbox-exporter)
      - ./certs/server.key:/etc/blackbox/server.key:ro
      - ./certs/ca.pem:/etc/blackbox/ca.pem:ro
      - ./certs/client-legacy-other.pem:/etc/blackbox/probe-client.pem:ro    # 無權限的 client 憑證,只用來完成 mTLS 握手
      - ./certs/client-legacy-other.key:/etc/blackbox/probe-client.key:ro

  # ===== 第 26 章:Grafana 與主機 / consumer lag 指標(profile grafana;用 scripts/grafana.sh on 啟動,會先備妥密碼與帳號) =====
  grafana:
    image: grafana/grafana:latest                     # 測試版本 13.2.3(記錄在 DESIGN-BASIS);正式環境請釘定版本
    container_name: grafana
    hostname: grafana
    profiles: ["grafana"]
    # 啟動前才從密碼檔讀 LDAP bind 密碼進環境變數(ldap.toml 只能展開環境變數);密碼不寫在 compose,docker inspect 看不到
    entrypoint: ["/bin/sh", "-c", "export LDAP_BIND_PW=$$(cat /etc/grafana/secrets/ldap-bind.pw); exec /run.sh"]
    ports: ["3000:3000"]
    environment:
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/tls/server.pem
      GF_SERVER_CERT_KEY: /etc/tls/server.key
      GF_SERVER_DOMAIN: localhost
      GF_SECURITY_ADMIN_USER: admin                         # 本機 admin 只留給 break-glass(AD 掛了還能進來),日常用 AD 帳號登入
      GF_SECURITY_ADMIN_PASSWORD__FILE: /etc/grafana/secrets/admin.pw
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_LDAP_ENABLED: "true"
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"                    # 第一次用 AD 帳號登入時自動建立 Grafana 使用者(角色由群組對映決定)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_METRICS_ENABLED: "true"
      GF_METRICS_BASIC_AUTH_USERNAME: Prometheus
      GF_METRICS_BASIC_AUTH_PASSWORD__FILE: /etc/grafana/secrets/metrics.pw
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - ./config/grafana/secrets:/etc/grafana/secrets:ro
      - ./certs:/etc/tls:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    profiles: ["grafana"]
    command:
      - --path.rootfs=/host
      - --web.config.file=/etc/node-exporter/web-config.yml
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro                                          # 容器環境看到的是 Docker 主機(VM)的磁碟與 CPU;正式環境每台 VM 各裝一個
      - ./config/grafana/node-web-config.yml:/etc/node-exporter/web-config.yml:ro
      - ./certs:/etc/tls:ro
    pid: host

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest                  # 社群專案(不是 Confluent 或 Prometheus 官方);測試版本 1.10.0
    container_name: kafka-exporter
    hostname: kafka-exporter
    profiles: ["grafana"]
    # 密碼從檔案讀進指令列(不寫在 compose)。連 broker 用 SCRAM 帳號 kafka-exporter(只有 Describe 權限的 ACL);自己的網頁走 HTTPS + mTLS
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec kafka_exporter --kafka.server=broker1:9094 --kafka.server=broker2:9094 --kafka.server=broker3:9094
        --sasl.enabled --sasl.mechanism=scram-sha512 --sasl.username=kafka-exporter --sasl.password="$$(cat /etc/secrets/kafka-exporter.pw)"
        --tls.enabled --tls.ca-file=/etc/tls/ca.pem --tls.server-name=broker1
        --server.tls.enabled --server.tls.cert-file=/etc/tls/server.pem --server.tls.key-file=/etc/tls/server.key
        --server.tls.mutual-auth-enabled --server.tls.ca-file=/etc/tls/ca.pem
        --topic.filter='^[^_].*' --group.filter='.*'
    volumes:
      - ./certs:/etc/tls:ro
      - ./config/grafana/secrets:/etc/secrets:ro

  # ===== 第 27 章:日誌與追蹤(profile observability;用 scripts/observability.sh on 啟動,會先備妥 Kafka 帳號、ACL 與 topic) =====
  loki:
    image: grafana/loki:latest                       # 測試版本 3.7.8
    container_name: loki
    hostname: loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./config/observability/loki.yml:/etc/loki/loki.yml:ro
      - ./certs:/etc/tls:ro
      - loki-data:/loki
    mem_limit: 384m

  tempo:
    image: grafana/tempo:latest                      # 測試版本 3.0.0
    container_name: tempo
    hostname: tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - ./certs:/etc/tls:ro
      - tempo-data:/var/tempo
    mem_limit: 384m

  alloy:
    image: grafana/alloy:latest                      # 測試版本 1.20.1
    container_name: alloy
    hostname: alloy
    profiles: ["observability"]
    # 密碼從檔案讀進環境變數(sys.env),不寫在 compose;docker.sock 唯讀掛載只為了讀測試容器的日誌(正式環境讀檔案,不需要)
    entrypoint: ["/bin/sh", "-c", "export ALLOY_PRODUCER_PW=$$(cat /etc/secrets/alloy-producer.pw) ALLOY_CONSUMER_PW=$$(cat /etc/secrets/alloy-consumer.pw); exec /bin/alloy run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy"]
    volumes:
      - ./config/observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./config/observability/secrets:/etc/secrets:ro
      - ./certs:/etc/tls:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 512m
    user: "0"

  # ===== 第 29 章:Kafka Connect(profile connect;用 scripts/connect-setup.sh on 啟動,會先備妥 AD 服務帳號、角色與外掛) =====
  connect1:
    image: confluentinc/cp-server-connect:8.3.2
    container_name: connect1
    hostname: connect1
    profiles: ["connect"]
    networks:
      default:
        aliases: [connect]      # 舊腳本與 DNS 輪詢用;兩台同一個 group.id,任一台都能收 REST 呼叫並轉給 leader
    ports: ["${HOST_PORT_CONNECT:-8083}:8083"]
    mem_limit: 1280m
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/jmx:/opt/jmx:ro
      - ./config/connect/plugins:/plugins:ro                    # 外掛(connect-file,由 connect-setup.sh 從 Maven Central 下載並校驗 SHA-1)
      - ./config/connect/secrets:/etc/connect-secrets:ro        # 連接器的密碼檔(config provider 讀這裡;正式環境由 CyberArk 提供)
    environment:
      # JMX exporter(官方 jmx-monitoring-stacks 的 kafka_connect.yml + HTTPS + Basic;scripts/jmx-setup.sh 產生),7778 埠供 Prometheus 抓取
      KAFKA_OPTS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_connect_tls.yml"
      # 堆積要小於容器上限:映像預設 -Xmx2G 大於 mem_limit 1280m,堆積長大時容器被 OOM 終止(實測 connect2 exit 137、OOMKilled=true)。
      #   官方建議 Connect 堆積 0.5 到 4 GB;堆積之外還要留 metaspace、執行緒與直接記憶體,所以取約上限的六成
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx768M"
      CONNECT_BOOTSTRAP_SERVERS: broker1:9094,broker2:9094,broker3:9094,broker4:9094
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect1
      CONNECT_LISTENERS: https://0.0.0.0:8083
      CONNECT_REST_ADVERTISED_LISTENER: https
      CONNECT_LISTENERS_HTTPS_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
      CONNECT_LISTENERS_HTTPS_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_LISTENERS_HTTPS_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_LISTENERS_HTTPS_SSL_KEY_PASSWORD: changeit
      # 2 台 worker 時,非 leader 收到的 REST 請求(建立連接器等)要轉給 leader:轉送用的 REST client 也讀 listeners.https.* 的 TLS 設定,
      #   沒有 truststore 就不信任對方憑證(實測:PKIX path building failed → 使用者拿到 HTTP 500)。單台時不會轉送,看不出來
      CONNECT_LISTENERS_HTTPS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONNECT_LISTENERS_HTTPS_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_LISTENERS_HTTPS_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_PLUGIN_PATH: /plugins,/usr/share/confluent-hub-components   # 只掃外掛目錄:掃 /usr/share/java 全部要數分鐘(實測),轉換器與 provider 本來就在 classpath
      CUB_CLASSPATH: '/usr/share/java/confluent-security/connect/*:/usr/share/java/kafka/*:/usr/share/java/cp-base-new/*'   # 啟動前的 kafka-ready 檢查也要認得 token callback handler(與 Schema Registry 同一個問題)
      # 每個連接器可以用自己的身分連 Kafka(producer.override.* / consumer.override.* / admin.override.*),不必共用 worker 的身分
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      # 連接器設定裡的密碼用 ${file:路徑:鍵} 引用,不把密碼寫進設定(設定會存進 connect-configs topic、也會從 REST 讀得到)
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      # worker 自己的身分:client 憑證(CN=connect)向 MDS 換 token(與 Schema Registry、REST Proxy 同一種做法)
      CONNECT_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_SASL_MECHANISM: OAUTHBEARER
      CONNECT_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      CONNECT_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls=\"https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094\";"
      CONNECT_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-connect.keystore.p12
      CONNECT_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_SSL_KEY_PASSWORD: changeit
      CONNECT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONNECT_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_PRODUCER_SASL_MECHANISM: OAUTHBEARER
      CONNECT_PRODUCER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls=\"https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094\";"
      CONNECT_PRODUCER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-connect.keystore.p12
      CONNECT_PRODUCER_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_PRODUCER_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_PRODUCER_SSL_KEY_PASSWORD: changeit
      CONNECT_PRODUCER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONNECT_PRODUCER_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_PRODUCER_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_CONSUMER_SASL_MECHANISM: OAUTHBEARER
      CONNECT_CONSUMER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls=\"https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094\";"
      CONNECT_CONSUMER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-connect.keystore.p12
      CONNECT_CONSUMER_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_CONSUMER_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_CONSUMER_SSL_KEY_PASSWORD: changeit
      CONNECT_CONSUMER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONNECT_CONSUMER_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_CONSUMER_SSL_TRUSTSTORE_PASSWORD: changeit
      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_SSL
      CONNECT_ADMIN_SASL_MECHANISM: OAUTHBEARER
      CONNECT_ADMIN_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
      CONNECT_ADMIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls=\"https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094\";"
      CONNECT_ADMIN_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-connect.keystore.p12
      CONNECT_ADMIN_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_ADMIN_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_ADMIN_SSL_KEY_PASSWORD: changeit
      CONNECT_ADMIN_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONNECT_ADMIN_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_ADMIN_SSL_TRUSTSTORE_PASSWORD: changeit
      # RBAC:使用者以 Basic(AD 帳密)進來,授權交給 MDS(scope 含 connect-cluster = group.id)
      CONNECT_REST_EXTENSION_CLASSES: io.confluent.connect.security.ConnectSecurityExtension
      CONNECT_REST_SERVLET_INITIALIZOR_CLASSES: io.confluent.common.security.jetty.initializer.InstallBearerOrBasicSecurityHandler
      CONNECT_PUBLIC_KEY_PATH: /etc/kafka/secrets/public.pem
      CONNECT_CONFLUENT_METADATA_BOOTSTRAP_SERVER_URLS: https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094
      CONNECT_CONFLUENT_METADATA_SERVER_URLS_MAX_AGE_MS: 60000
      CONNECT_CONFLUENT_METADATA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/client-connect.keystore.p12
      CONNECT_CONFLUENT_METADATA_SSL_KEYSTORE_TYPE: PKCS12
      CONNECT_CONFLUENT_METADATA_SSL_KEYSTORE_PASSWORD: changeit
      CONNECT_CONFLUENT_METADATA_SSL_KEY_PASSWORD: changeit
      CONNECT_CONFLUENT_METADATA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      CONNECT_CONFLUENT_METADATA_SSL_TRUSTSTORE_TYPE: PKCS12
      CONNECT_CONFLUENT_METADATA_SSL_TRUSTSTORE_PASSWORD: changeit
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  connect2:
    extends: { service: connect1 }
    container_name: connect2
    hostname: connect2
    # extends 會把 connect1 的 ports 合併進來(兩台搶 8083,實測:driver failed programming external connectivity);!override 改成只用自己的埠
    ports: !override ["${HOST_PORT_CONNECT2:-8183}:8083"]
    environment:
      CONNECT_REST_ADVERTISED_HOST_NAME: connect2

volumes:
  minio-data:
  loki-data:
  tempo-data:
  alloy-data:
