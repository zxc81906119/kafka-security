# Demo: Confluent Platform 8.3(KRaft)+ MDS RBAC + LDAP(模擬 AD)+ 共用單一 server 憑證
# 拓樸(對照客戶環境):3 台 controller(動態 quorum)+ 4 台 broker、副本 3 / min.insync.replicas 2;
#   REST Proxy、Schema Registry、Connect 各 2 台(REST Proxy 前面一個 L4 負載平衡器當 F5 的替身);Control Center 1 台。
# 啟動請用 scripts/up.sh(需先產生憑證、設定 license 試用)。可選元件用 profile 控制(記憶體):
#   restproxy、sr、connect、c3、grafana、observability、cyberark、mail、tier、sbc、quorum。
name: cpsec

x-common-ssl: &common-ssl
  KAFKA_SSL_KEYSTORE_FILENAME: server.keystore.p12
  KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
  KAFKA_SSL_KEY_CREDENTIALS: sslkey_creds
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_OPTS: "-Ddemo.cpsec=1"
  KAFKA_CONFLUENT_BALANCER_ENABLE: "${SBC_ENABLE:-false}"   # 第 31 章:scripts/sbc-setup.sh on 會在 .env 設 SBC_ENABLE=true(controller 與 broker 都要)
  KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_SSL_CLIENT_AUTH: none
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
  KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.3,TLSv1.2     # 第 19 章:只留 TLS 1.2 / 1.3(明確列出,不靠 JDK 預設)
  KAFKA_SSL_CIPHER_SUITES: TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256   # 只留 AEAD(GCM / ChaCha20);實測未設定時 broker 接受 ECDHE-RSA-AES128-SHA(CBC + SHA-1)

x-ldap-env: &ldap-env   # 只有 broker 需要(controller 不需要:實測無 LDAP 設定的 controller,群組型 role 的 CreateTopics 仍正確授權)
  # --- LDAP(模擬 AD):bind DN 唯讀查詢帳號 + 以群組成員屬性對映 ---
  KAFKA_LDAP_JAVA_NAMING_FACTORY_INITIAL: com.sun.jndi.ldap.LdapCtxFactory
  KAFKA_LDAP_COM_SUN_JNDI_LDAP_READ_TIMEOUT: 3000
  KAFKA_LDAP_JAVA_NAMING_PROVIDER_URL: ldaps://openldap:636     # AD 走 LDAPS(正式環境連 AD 的 636 或 3269);只有連 AD 的 JVM 需要 ldap.ssl.truststore
  KAFKA_LDAP_JAVA_NAMING_SECURITY_PROTOCOL: SSL
  KAFKA_LDAP_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_LDAP_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_LDAP_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_LDAP_JAVA_NAMING_SECURITY_PRINCIPAL: cn=svc-kafka-ldap,ou=system,dc=corp,dc=demo
  KAFKA_LDAP_JAVA_NAMING_SECURITY_CREDENTIALS: ldap-bind-pw
  KAFKA_LDAP_JAVA_NAMING_SECURITY_AUTHENTICATION: simple
  KAFKA_LDAP_SEARCH_MODE: GROUPS
  KAFKA_LDAP_GROUP_SEARCH_BASE: ou=groups,dc=corp,dc=demo
  KAFKA_LDAP_GROUP_OBJECT_CLASS: groupOfNames
  KAFKA_LDAP_GROUP_NAME_ATTRIBUTE: cn
  KAFKA_LDAP_GROUP_MEMBER_ATTRIBUTE: member
  KAFKA_LDAP_GROUP_MEMBER_ATTRIBUTE_PATTERN: "(?i)CN=([^,]+),.*"   # 客戶 AD 的 member 格式 CN=<帳號大寫>,OU=…;(?i) 讓 demo 不管 DN 屬性名稱大小寫
  KAFKA_LDAP_USER_SEARCH_BASE: ou=users,dc=corp,dc=demo
  KAFKA_LDAP_USER_OBJECT_CLASS: inetOrgPerson
  KAFKA_LDAP_USER_NAME_ATTRIBUTE: cn          # 客戶的使用者名稱 = CN
  KAFKA_LDAP_USER_SEARCH_SCOPE: 2             # 使用者分散在多層 OU,要搜尋整個子樹(官方預設 1)
  KAFKA_LDAP_REFRESH_INTERVAL_MS: 5000
  # 登入後的身分用 AD 紀錄的大小寫,不是使用者輸入的字串(實測 2026-10-05:使用者輸入 GARY 也對得到群組);原本只在 spike override,2026-10-06 納入主設定
  KAFKA_LDAP_PRINCIPAL_MAPPING: ldap


# 副本數:4 台 broker、副本 3、min.insync.replicas 2(controller 與 broker 共用)
x-rf: &rf
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_TOPIC_REPLICAS: 3
  KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 3

# 動態 quorum:名單存在叢集 metadata;controller.quorum.bootstrap.servers 只用來找到 quorum(官方:動態 quorum 不設 controller.quorum.voters)
x-quorum: &quorum
  KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: controller1:9093,controller2:9093,controller3:9093

# 第 22 章:controller 也把指標送到 Prometheus(KRaft 下 ActiveControllerCount、OfflinePartitionsCount 只有 controller 有)
x-ha-ctrl-telemetry: &ha-ctrl-telemetry
  KAFKA_METRIC_REPORTERS: org.apache.kafka.common.metrics.JmxReporter,io.confluent.telemetry.reporter.TelemetryReporter   # Kafka 4.x:設了 metric.reporters 就不再自動帶 JmxReporter,要明確列出,否則 raft、socket-server 等指標不會出現在 JMX exporter
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: "http"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "true"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL: "https://prometheus:9090/api/v1/otlp"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION: "gzip"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY: "telemetry"            # api.key / api.secret 就是 Prometheus 的 Basic 帳密
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET: "telemetry-pw"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX: "80"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX: "4000"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX: "10"
  KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS: "60000"
  KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE: "io.confluent.kafka.server.controller.(?!.*delta).*|io.confluent.kafka.server.raft.(?!.*delta).*|io.confluent.kafka.server.kafka.controller.(?!.*delta).*"

# 第 22 章:JMX exporter(Prometheus 官方 Java agent)——每個 broker 與 controller 在 7778 埠開 /metrics,供 Prometheus 抓取。
# agent(Maven Central)與各元件的設定檔(Confluent 官方 jmx-monitoring-stacks,釘定 commit 並校驗 SHA-256)由 scripts/jmx-setup.sh 下載到 config/jmx/(scripts/ha.sh on 會自動執行)。
x-ha-jmx-broker: &ha-jmx-broker
  KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_broker_tls.yml"
x-ha-jmx-controller: &ha-jmx-controller
  KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_controller_tls.yml"


x-broker-env: &broker-env
  <<: [*common-ssl, *ldap-env, *rf, *quorum]
  CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL,CLIENT:SASL_SSL
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_HEAP_OPTS: "-Xms640m -Xmx640m"
  # --- 內部通道:CONTROLLER(broker→controller)與 INTERNAL(broker↔broker)都是 mTLS,共用一張憑證 internal.keystore.p12(CN=kafka-internal)---
  #   不用 SASL:SCRAM 憑證存在 metadata 裡,刪除過 SCRAM 憑證後重啟 broker 會因為自己認證不過而起不來(見 RUNBOOK 第 19 章);mTLS 身分不依賴 metadata。
  #   身分 = 憑證 CN(ssl.principal.mapping.rules)→ User:kafka-internal(在 super.users)。同一張憑證 broker 與 controller 共用,代價是 audit 看不出是哪一台。
  KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^.*CN=([^,]*).*$$/$$1/,DEFAULT"
  KAFKA_LISTENER_NAME_INTERNAL_SSL_CLIENT_AUTH: required
  KAFKA_LISTENER_NAME_CONTROLLER_SSL_CLIENT_AUTH: required
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_PASSWORD: changeit
  KAFKA_LISTENER_NAME_INTERNAL_SSL_KEY_PASSWORD: changeit
  KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12
  KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_PASSWORD: changeit
  KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEY_PASSWORD: changeit
  # --- CLIENT listener:人 = PLAIN + LDAP;服務 = SCRAM ---
  KAFKA_LISTENER_NAME_CLIENT_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512,OAUTHBEARER
  KAFKA_LISTENER_NAME_CLIENT_CONNECTIONS_MAX_REAUTH_MS: "60000"   # 第 19 章:SASL 連線每 60 秒重新認證(demo 為了讓實驗看得到效果;正式環境建議 1 小時,依 client 數量評估)。預設 0 = 連著就永遠有效,第 18 章實驗就是這個情況。這個設定不能動態改,要重啟 broker
  KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.security.auth.provider.ldap.LdapAuthenticateCallbackHandler
  KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required;
  KAFKA_LISTENER_NAME_CLIENT_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
  # --- CLIENT listener 同時接受 MDS 簽發的 token(OAUTHBEARER):C3 / REST Proxy 代表使用者、人用 confluent login 的腳本 ---
  KAFKA_LISTENER_NAME_CLIENT_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerValidatorCallbackHandler
  KAFKA_LISTENER_NAME_CLIENT_OAUTHBEARER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
  KAFKA_LISTENER_NAME_CLIENT_OAUTHBEARER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required publicKeyPath="/etc/kafka/secrets/public.pem";
  # --- 授權 ---
  KAFKA_AUTHORIZER_CLASS_NAME: io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
  KAFKA_LOG4J_LOGGERS: "kafka.authorizer.logger=INFO,io.confluent.security.authorizer=INFO"
  KAFKA_CONFLUENT_AUTHORIZER_ACCESS_RULE_PROVIDERS: CONFLUENT,KRAFT_ACL
  KAFKA_SUPER_USERS: User:kafka-internal;User:kafka-broker;User:kafka-controller;User:bootstrap
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_CONFLUENT_REPORTERS_TELEMETRY_AUTO_ENABLE: "false"
  # --- MDS:token ---
  KAFKA_CONFLUENT_SECURITY_EVENT_ROUTER_CONFIG: ${AUDIT_ROUTER_CONFIG}
  KAFKA_CONFLUENT_METADATA_SERVER_AUTHENTICATION_METHOD: BEARER
  KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_KEY_PATH: /etc/kafka/secrets/keypair.pem
  KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_MAX_LIFETIME_MS: 3600000
  KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_SIGNATURE_ALGORITHM: RS256
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.p12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEYSTORE_PASSWORD: changeit
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_KEY_PASSWORD: changeit
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_PASSWORD_ENCODER_SECRET: encoder-secret
  # --- 指標送到 Prometheus(C3 next-gen 需要) ---
  KAFKA_METRIC_REPORTERS: org.apache.kafka.common.metrics.JmxReporter,io.confluent.telemetry.reporter.TelemetryReporter   # Kafka 4.x:設了 metric.reporters 就不再自動帶 JmxReporter,要明確列出,否則 raft、socket-server 等指標不會出現在 JMX exporter
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: "http"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "true"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE: "io.confluent.kafka.server.request.(?!.*delta).*|io.confluent.kafka.server.server.broker.state|io.confluent.kafka.server.replica.manager.leader.count|io.confluent.kafka.server.request.queue.size|io.confluent.kafka.server.broker.topic.failed.produce.requests.rate.1.min|io.confluent.kafka.server.tier.archiver.total.lag|io.confluent.kafka.server.request.total.time.ms.p99|io.confluent.kafka.server.broker.topic.failed.fetch.requests.rate.1.min|io.confluent.kafka.server.broker.topic.total.fetch.requests.rate.1.min|io.confluent.kafka.server.partition.caught.up.replicas.count|io.confluent.kafka.server.partition.observer.replicas.count|io.confluent.kafka.server.tier.tasks.num.partitions.in.error|io.confluent.kafka.server.broker.topic.bytes.out.rate.1.min|io.confluent.kafka.server.request.total.time.ms.p95|io.confluent.kafka.server.controller.active.controller.count|io.confluent.kafka.server.request.total.time.ms.p999|io.confluent.kafka.server.controller.active.broker.count|io.confluent.kafka.server.request.handler.pool.request.handler.avg.idle.percent.rate.1.min|io.confluent.kafka.server.controller.unclean.leader.elections.rate.1.min|io.confluent.kafka.server.replica.manager.partition.count|io.confluent.kafka.server.controller.unclean.leader.elections.total|io.confluent.kafka.server.partition.replicas.count|io.confluent.kafka.server.broker.topic.total.produce.requests.rate.1.min|io.confluent.kafka.server.controller.offline.partitions.count|io.confluent.kafka.server.socket.server.network.processor.avg.idle.percent|io.confluent.kafka.server.partition.under.replicated|io.confluent.kafka.server.log.log.start.offset|io.confluent.kafka.server.log.tier.size|io.confluent.kafka.server.log.size|io.confluent.kafka.server.tier.fetcher.bytes.fetched.total|io.confluent.kafka.server.request.total.time.ms.p50|io.confluent.kafka.server.tenant.consumer.lag.offsets|io.confluent.kafka.server.log.log.end.offset|io.confluent.kafka.server.broker.topic.bytes.in.rate.1.min|io.confluent.kafka.server.partition.under.min.isr|io.confluent.kafka.server.partition.in.sync.replicas.count|io.confluent.telemetry.http.exporter.batches.dropped|io.confluent.telemetry.http.exporter.items.total|io.confluent.telemetry.http.exporter.items.succeeded|io.confluent.telemetry.http.exporter.send.time.total.millis|io.confluent.kafka.server.controller.leader.election.rate.(?!.*delta).*|io.confluent.telemetry.http.exporter.batches.failed|io.confluent.kafka.server.socket.server.failed.authentication.total(?!.*delta).*|io.confluent.kafka.server.socket.server.successful.authentication.total(?!.*delta).*|io.confluent.kafka.server.socket.server.failed.reauthentication.total(?!.*delta).*|io.confluent.kafka.server.socket.server.connection.count(?!.*delta).*|io.confluent.kafka.server.socket.server.connection.quotas.total.limit(?!.*delta).*"   # 第 19 章:只加明確要用的指標(認證失敗/成功、重新認證失敗、連線數與上限)。名稱後面要加 (?!.*delta).*:同名的 delta 型態 Prometheus 不收,整批會被拒(實測,連原本的監控指標也跟著丟);也不要用萬用字元
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL: "https://prometheus:9090/api/v1/otlp"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION: "gzip"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY: "telemetry"            # api.key / api.secret 就是 Prometheus 的 Basic 帳密
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET: "telemetry-pw"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_HTTPS_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX: "80"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX: "4000"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX: "10"
  KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS: "60000"
  KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
  KAFKA_CONFLUENT_METADATA_SERVER_IMPERSONATION_SUPER_USERS: "User:restproxy"
  KAFKA_CONFLUENT_METADATA_SERVER_IMPERSONATION_PROTECTED_USERS: "User:bootstrap;User:kafka-broker;User:kafka-controller;User:c3;User:restproxy;User:GARY"
  KAFKA_CONFLUENT_METADATA_SERVER_SSL_CLIENT_AUTHENTICATION: REQUESTED
  KAFKA_CONFLUENT_METADATA_SERVER_AUTH_SSL_PRINCIPAL_MAPPING_RULES: "RULE:.*CN=([a-zA-Z0-9.-]*).*$$/$$1/,DEFAULT"
  # --- broker 內建 Admin REST(/kafka/v3)的 RBAC 保護:屬性依官方 Admin REST Security 頁(kafka.rest. 前綴)。未設定時此 REST 完全無認證 ---
  KAFKA_KAFKA_REST_REST_SERVLET_INITIALIZOR_CLASSES: io.confluent.common.security.jetty.initializer.InstallBearerOrBasicSecurityHandler
  KAFKA_KAFKA_REST_KAFKA_REST_RESOURCE_EXTENSION_CLASS: io.confluent.kafkarest.security.KafkaRestSecurityResourceExtension
  KAFKA_KAFKA_REST_PUBLIC_KEY_PATH: /etc/kafka/secrets/public.pem
  KAFKA_KAFKA_REST_CONFLUENT_METADATA_BOOTSTRAP_SERVER_URLS: https://broker1:8091,https://broker2:8092,https://broker3:8093,https://broker4:8094
  KAFKA_KAFKA_REST_CONFLUENT_METADATA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_KAFKA_REST_CONFLUENT_METADATA_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_KAFKA_REST_CONFLUENT_METADATA_SSL_TRUSTSTORE_PASSWORD: changeit
  KAFKA_KAFKA_REST_BOOTSTRAP_SERVERS: SASL_SSL://broker1:9094,SASL_SSL://broker2:9094,SASL_SSL://broker3:9094,SASL_SSL://broker4:9094
  KAFKA_KAFKA_REST_CLIENT_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_KAFKA_REST_CLIENT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
  KAFKA_KAFKA_REST_CLIENT_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_KAFKA_REST_CLIENT_SSL_TRUSTSTORE_PASSWORD: changeit

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    hostname: openldap
    environment:
      LDAP_ORGANISATION: "Corp Demo"
      LDAP_DOMAIN: "corp.demo"
      LDAP_BASE_DN: "dc=corp,dc=demo"
      LDAP_ADMIN_PASSWORD: adminpw
      LDAP_TLS: "true"                       # 模擬 AD 的 LDAPS(636);389 仍開著,只給 demo 的管理工具(phpLDAPadmin、ldapmodify)用
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ./certs/server.pem:/container/service/slapd/assets/certs/ldap.crt:ro       # 共用 server 憑證(SAN 已含 openldap)
      - ./certs/server.key:/container/service/slapd/assets/certs/ldap.key:ro
      - ./certs/ca.pem:/container/service/slapd/assets/certs/ca.crt:ro
    command: --copy-service
    ports:
      - "${HOST_PORT_LDAP:-389}:389"
    healthcheck:   # 以 admin 查 base DN;osixia 映像內有 ldapsearch
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=corp,dc=demo -D cn=admin,dc=corp,dc=demo -w adminpw -s base dn >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  ldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: ldapadmin
    hostname: ldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${HOST_PORT_LDAPADMIN:-8081}:80"
    depends_on: [openldap]

  controller1:
    stop_grace_period: 60s
    image: confluentinc/cp-server:${CP_VERSION:-8.3.2}   # 第 35 章(升級實驗):CP_VERSION 可切換 controller / broker 的版本;預設 8.3.2
    container_name: controller1
    hostname: controller1
    healthcheck:   # CP 映像沒有 curl/nc,用 bash 的 /dev/tcp 確認 controller 埠已在聽(只代表埠開了,功能就緒由 up.sh 的 MDS 檢查確認)
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/controller1/9093'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    volumes:
      - ./certs:/etc/kafka/secrets:ro
      - ./config/jmx:/opt/jmx:ro
      - ./config/ensure-controller.sh:/etc/confluent/docker/ensure:ro
    environment:
      <<: [*common-ssl, *ha-ctrl-telemetry, *rf, *quorum]
      # 官方(MDS 設定頁):RBAC 下 KRaft controller 設 kraft.controller.enabled=true 並提供 token key;controller 不需要 ldap.*(只有 MDS writer broker 連 LDAP,實測 ch11 通過)
      KAFKA_CONFLUENT_METADATA_SERVER_KRAFT_CONTROLLER_ENABLED: "true"
      KAFKA_CONFLUENT_METADATA_SERVER_TOKEN_KEY_PATH: /etc/kafka/secrets/keypair.pem
      CLUSTER_ID: XyZBQ3-GTvKH2qNfP7X33A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      QUORUM_INITIAL_CONTROLLERS: "1@controller1:9093:${QDIR1:-hakFaGfNbL7uvJSEFoyrsw},2@controller2:9093:${QDIR2:-NEbDIbDQIiecrTGu-P5MUQ},3@controller3:9093:${QDIR3:-ExctQgSpFMcX9r2MVC3hPw}"
      KAFKA_LISTENERS: CONTROLLER://controller1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL     # KRaft 下 Self-Balancing 跑在 controller,官方要求 controller 也設(第 31 章)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,INTERNAL:SSL     # controller 不監聽 INTERNAL,只是以 client 身分連 broker 的 INTERNAL 埠(balancer)
      KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12
      KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_LISTENER_NAME_INTERNAL_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_LISTENER_NAME_INTERNAL_SSL_KEY_PASSWORD: changeit
      KAFKA_CONFLUENT_BALANCER_GOAL_VIOLATION_DELAY_ON_NEW_BROKERS_MS: 180000   # 第 31 章 demo 專用:預設 1800000(30 分鐘);官方設定頁沒列這項,正式環境維持預設
      # 內部通道 mTLS(與 broker 共用同一張 internal.keystore.p12,CN=kafka-internal)
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^.*CN=([^,]*).*$$/$$1/,DEFAULT"
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_LISTENER_NAME_CONTROLLER_SSL_KEY_PASSWORD: changeit
      # RBAC 部署:controller 也使用 ConfluentServerAuthorizer(CreateTopics 等請求在 controller 端授權,否則看不到 RBAC role binding)
      KAFKA_AUTHORIZER_CLASS_NAME: io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
      KAFKA_CONFLUENT_AUTHORIZER_ACCESS_RULE_PROVIDERS: CONFLUENT,KRAFT_ACL
      # controller 端 RBAC provider 需連到 brokers 讀取 MDS 的授權資料(_confluent-metadata-auth),以獨立的內部 SCRAM 身分 kafka-controller(super user;與 broker 的 kafka-broker 分開,audit 與撤銷才分得清)
      KAFKA_CONFLUENT_METADATA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092,broker4:9092
      KAFKA_CONFLUENT_METADATA_SECURITY_PROTOCOL: SSL
      KAFKA_CONFLUENT_METADATA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12
      KAFKA_CONFLUENT_METADATA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CONFLUENT_METADATA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_CONFLUENT_METADATA_SSL_KEY_PASSWORD: changeit
      KAFKA_CONFLUENT_METADATA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_CONFLUENT_METADATA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CONFLUENT_METADATA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_PASSWORD_ENCODER_SECRET: encoder-secret
      # audit log 寫入器連線(controller 沒有 inter-broker 設定,需明列)
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092,broker4:9092
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SECURITY_PROTOCOL: SSL
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/internal.keystore.p12
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CONFLUENT_SECURITY_EVENT_LOGGER_EXPORTER_KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_CONFLUENT_SECURITY_EVENT_ROUTER_CONFIG: ${AUDIT_ROUTER_CONFIG}
      KAFKA_OPTS: "-Ddemo.cpsec=1 -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7778:/opt/jmx/kafka_controller_tls.yml"
      KAFKA_SUPER_USERS: User:kafka-internal;User:kafka-broker;User:kafka-controller;User:bootstrap
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      # 啟動前預建 SCRAM 憑證(見 ensure-controller.sh)。內部通道已改 mTLS,不再使用;kafka-broker 仍給維運/測試用 CLIENT listener 的 SCRAM 登入
      SCRAM_BOOTSTRAP_1: "SCRAM-SHA-512=[name=kafka-broker,password=broker-secret]"
      SCRAM_BOOTSTRAP_2: "SCRAM-SHA-512=[name=kafka-controller,password=controller-secret]"

