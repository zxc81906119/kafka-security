# DR 站(第 36 章)的 bootstrap(super user):同 token-bootstrap.properties,但向 DR 站自己的 MDS 換 token
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://dr-broker1:8091,https://dr-broker2:8091,https://dr-broker3:8091";
ssl.keystore.location=/etc/kafka/secrets/client-bootstrap.keystore.p12
ssl.keystore.type=PKCS12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.type=PKCS12
ssl.truststore.password=changeit
