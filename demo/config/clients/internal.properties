# 內部通道共用憑證(mTLS,CN=kafka-internal):broker↔broker、broker↔controller 都用這一張。拿到它就等於 super user,private key 要保護好。
security.protocol=SSL
ssl.keystore.location=/etc/kafka/secrets/internal.keystore.p12
ssl.keystore.type=PKCS12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.type=PKCS12
ssl.truststore.password=changeit
