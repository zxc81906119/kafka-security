# REST Proxy 前面的 L4(TCP)負載平衡器——F5 的替身。TLS 不在這裡終止:client 憑證(mTLS)要走到 REST Proxy 本身。
# 被動健康檢查:連線失敗達 max_fails 次就把該台暫時移出 fail_timeout 秒(F5 用主動健康檢查,做法不同但效果相同)。
worker_processes 1;
events { worker_connections 1024; }
stream {
  upstream restproxy_backend {
    hash $remote_addr consistent;     # sticky(來源位址黏著):官方說 REST Proxy 的 consumer API 有狀態,負載平衡器預設要 sticky
    server restproxy1:8086 max_fails=2 fail_timeout=10s;
    server restproxy2:8086 max_fails=2 fail_timeout=10s;
  }
  server {
    listen 8086;
    proxy_pass restproxy_backend;
    proxy_connect_timeout 3s;
  }
}
