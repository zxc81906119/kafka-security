# Conjur 的 TLS 入口:終止 TLS 後轉給 conjur-server(HTTP);憑證用 demo 共用 server 憑證(SAN 含 conjur)
server {
  listen 443 ssl;
  server_name conjur;
  ssl_certificate     /etc/tls/server.pem;
  ssl_certificate_key /etc/tls/server.key;
  location / {
    proxy_pass http://conjur-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
