# 第 22 章:平台維運告警(Prometheus 規則 → Alertmanager)。指標來自 broker 與 controller 的 telemetry(HA 模式下 controller 也會送;見 docker-compose.ha.yml)。
# 對應《銀行導入手冊》4.1:官方至少要求 ActiveControllerCount、OfflinePartitionsCount、UncleanLeaderElectionsPerSec 的告警,並建議 UnderReplicatedPartitions。
# 門檻是範例值:正式環境依客戶的 controller 數、副本數與容忍時間調整。告警由 Alertmanager 轉到值班群組。
# 時間:telemetry 每 60 秒送一次、規則每 60 秒評估一次,所以告警最慢約 2 到 3 分鐘才會出現。
groups:
- name: kafka-platform
  rules:
  - alert: KafkaUnderReplicatedPartitions
    expr: sum(io_confluent_kafka_server_partition_under_replicated) > 0
    for: 0m
    labels: { severity: warning, kind: platform }
    annotations:
      summary: "有 {{ $value }} 個分區的副本不足(URP)"
      description: "有 broker 掉線或追不上。先看哪台 broker 不健康;URP 持續不降要查網路、磁碟與 ISR。滾動重啟時暫時出現屬正常,每台重啟後要等它回 0 才做下一台。"
  - alert: KafkaUnderMinIsrPartitions
    expr: sum(io_confluent_kafka_server_partition_under_min_isr) > 0
    for: 0m
    labels: { severity: critical, kind: platform }
    annotations:
      summary: "有 {{ $value }} 個分區的 ISR 低於 min.insync.replicas"
      description: "acks=all 的 producer 寫入會被拒絕。立刻恢復掉線的 broker;acks=1 的寫入可能看似成功卻讀不到。"
  - alert: KafkaOfflinePartitions
    expr: sum(io_confluent_kafka_server_controller_offline_partitions_count) > 0
    for: 0m
    labels: { severity: critical, kind: platform }
    annotations:
      summary: "有 {{ $value }} 個分區沒有 leader(離線)"
      description: "該分區無法讀寫。官方列為必設告警。通常是副本只有 1 份且所在 broker 掉線,或所有同步副本都掉線。"
  - alert: KafkaActiveControllerCountNotOne
    expr: sum(io_confluent_kafka_server_controller_active_controller_count) != 1
    for: 0m
    labels: { severity: critical, kind: platform }
    annotations:
      summary: "active controller 數量是 {{ $value }}(應該恰好 1)"
      description: "0 代表 controller 失去多數(quorum),叢集無法建立 topic、換 leader;大於 1 代表腦裂。官方列為必設告警。"
  - alert: KafkaControllerMissing
    # 3 是這個環境的 controller 數(正式環境依實際數量)。近 3 分鐘沒送指標的 controller 視為掉線。
    expr: count(count_over_time(io_confluent_kafka_server_controller_active_controller_count[3m])) < 3
    for: 0m
    labels: { severity: warning, kind: platform }
    annotations:
      summary: "只有 {{ $value }} 台 controller 在送指標(應為 3)"
      description: "有 controller 掉線。剩 2 台仍有多數,但再掉 1 台就失去 quorum。"
  - alert: KafkaUncleanLeaderElection
    expr: sum(increase(io_confluent_kafka_server_controller_unclean_leader_elections_total[10m])) > 0
    for: 0m
    labels: { severity: critical, kind: platform }
    annotations:
      summary: "發生 unclean leader election"
      description: "代表選了一個不同步的副本當 leader,可能遺失已確認的資料。官方要求此值應為 0。"
  - alert: KafkaBrokerFenced
    expr: max(io_confluent_kafka_server_controller_fenced_broker_count) > 0
    for: 0m
    labels: { severity: warning, kind: platform }
    annotations:
      summary: "有 {{ $value }} 台 broker 被 controller 隔離(fenced)"
      description: "broker 與 controller 失聯超過 session 逾時。查該 broker 的程序、網路與日誌。"
