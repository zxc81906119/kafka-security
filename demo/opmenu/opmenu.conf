# opmenu.conf — 這個環境的設定(目前:docker demo)。換環境只改這個檔案;所有項目與預設值見 lib/defaults.sh
# cluster ID、node 清單、replication factor 由登入後自動推算(選單項目 19 可查看);broker 與服務清單是允許清單,必須明確填。
OPMENU_BACKEND=docker
OPMENU_ENV_LABEL=DEMO

OPMENU_BOOTSTRAP='broker1:9094,broker2:9094'
OPMENU_MDS_URL='https://broker1:8091'   # demo 的 broker2 MDS 埠不同(8092),所以明確指定

OPMENU_BROKER_SERVICES='broker1 broker2'
OPMENU_AUX_SERVICES='restproxy control-center'
OPMENU_CONTROLLER_HOSTS='controller1'
OPMENU_ALERTMANAGER_URL='https://alertmanager:9093'                 # Alertmanager 走 HTTPS + Basic
OPMENU_ALERTMANAGER_AUTH_FILE="$OPMENU_HOME/alertmanager.auth"   # 維護模式專用帳號(帳號:密碼);正式環境放跳板機、權限限 opmenu 操作群組
OPMENU_DATA_DIR='/var/lib/kafka/data'

# 測試用:接受 OPMENU_USER/PASS/YES/TICKET 環境變數(test-*.sh 用);正式環境不要設
OPMENU_ALLOW_ENV_OVERRIDE=1
