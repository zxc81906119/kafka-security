# jump host(Rocky Linux 9 容器)的 opmenu 設定;掛到 /etc/opmenu/opmenu.conf。
# Kafka 用 demo 的 cluster(同一個 docker 網路);主機操作對象是假 node node1。
OPMENU_BACKEND=vm
OPMENU_ENV_LABEL=ROCKY
OPMENU_LOG=/var/log/opmenu/opmenu.log
OPMENU_OUT_DIR=/var/log/opmenu

OPMENU_BOOTSTRAP='broker1:9094,broker2:9094'
OPMENU_MDS_URL='https://broker1:8091,https://broker2:8092'
OPMENU_KAFKA_CLUSTER_ID='XyZBQ3-GTvKH2qNfP7X33A'
OPMENU_TRUSTSTORE='/etc/kafka/secrets/truststore.p12'
OPMENU_TRUSTSTORE_PASSWORD_FILE='/etc/kafka/secrets/truststore_creds'
OPMENU_CA_PEM='/etc/kafka/secrets/ca.pem'
OPMENU_CERT_DIR='/etc/kafka/secrets'

OPMENU_HOSTS='node1'
OPMENU_BROKER_SERVICES='node1:confluent-server'
OPMENU_AUX_SERVICES='node1:confluent-control-center'
OPMENU_DATA_DIR='/var/lib/kafka'
OPMENU_SSH_USER=''
OPMENU_USER_FROM_OS=1
OPMENU_BOOTSTRAP_WRAPPER='/usr/local/sbin/opmenu-bootstrap'
OPMENU_BOOTSTRAP_USER='opbootstrap'
OPMENU_CLEAN_LOGS_CMD='/usr/local/sbin/opmenu-clean-logs'

OPMENU_TICKET_MODE=required
OPMENU_TICKET_CHECK=format
OPMENU_REPLICATION=2

# 與 opmenu.conf 相同,只差 ssh 用 AD 密碼(測試「兩邊都接 AD」時用:docker exec -it -e OPMENU_CONF=/etc/opmenu/opmenu-password.conf rocky-jump su -p gary)
OPMENU_SSH_AUTH=password
OPMENU_ALLOW_ENV_OVERRIDE=1
