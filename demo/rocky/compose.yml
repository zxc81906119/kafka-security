# Rocky Linux 9 測試:跳板機 + 假節點;接到 demo 的網路以使用現有 Kafka 叢集。
#   docker compose -f rocky/compose.yml up -d --build      (在 demo/ 目錄)
#   docker exec -it rocky-jump su - gary                    (操作員登入 → 直接進選單)
services:
  jump:
    build: { context: ./jump, additional_contexts: { keys: ./keys } }
    container_name: rocky-jump
    hostname: jump
    init: true          # 有 init 收僵屍行程(正式環境由 systemd 做);沒有的話被 kill 的選單行程會留成 zombie
    networks: [cpsec]
    volumes:
      - ../opmenu:/opt/opmenu:ro
      - ./opmenu.conf:/etc/opmenu/opmenu.conf:ro
      - ./opmenu-password.conf:/etc/opmenu/opmenu-password.conf:ro
      - ../certs:/mnt/certs:ro
  node1:
    build: { context: ./node, additional_contexts: { keys: ./keys } }
    container_name: rocky-node1
    hostname: node1
    networks: [cpsec]
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
networks:
  cpsec:
    external: true
    name: cpsec_default
