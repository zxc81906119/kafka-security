# kafka-rest.properties — 由 tools/config-export.mjs 從已驗證的 demo 設定(restproxy1)產生;<…> 為依環境填入的值
auth.ssl.principal.mapping.rules=RULE:^.*CN=([^,]*).*$/$1/,DEFAULT
bootstrap.servers=SASL_SSL://<BROKER1_HOST>:9094,SASL_SSL://<BROKER2_HOST>:9094,SASL_SSL://<BROKER3_HOST>:9094,SASL_SSL://<BROKER4_HOST>:9094
client.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
client.sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
# REST Proxy 自身(license 檢查、kafka-ready 健康檢查)用 client 憑證(CN=restproxy)向 MDS 換 token,以 OAUTHBEARER 連 broker(官方 mTLS RBAC 範例做法);代表使用者的請求改用該使用者的 MDS token
client.sasl.mechanism=OAUTHBEARER
# 連 broker 的 Kafka client:CLIENT listener(全部用 OAUTHBEARER:代表使用者/機器的請求帶該主體的 token;REST Proxy 自身用 CN=restproxy 憑證換的 token)
client.security.protocol=SASL_SSL
client.ssl.keystore.location=<SSL_DIR>/client-restproxy.keystore.p12
client.ssl.keystore.password=<由 CyberArk 提供>
client.ssl.keystore.type=PKCS12
client.ssl.key.password=<由 CyberArk 提供>
client.ssl.truststore.location=<SSL_DIR>/truststore.p12
client.ssl.truststore.password=<由 CyberArk 提供>
client.ssl.truststore.type=PKCS12
# REST Proxy 自身向 MDS 認證:mTLS(CN=restproxy),不是 AD 帳號
confluent.metadata.bootstrap.server.urls=https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094
confluent.metadata.server.urls.max.age.ms=60000
confluent.metadata.ssl.keystore.location=<SSL_DIR>/client-restproxy.keystore.p12
confluent.metadata.ssl.keystore.password=<由 CyberArk 提供>
confluent.metadata.ssl.keystore.type=PKCS12
confluent.metadata.ssl.key.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.metadata.ssl.truststore.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.type=PKCS12
host.name=<RESTPROXY1_HOST>
# 官方:多實例每台 id 必須唯一(預設空值在多台時不安全)
id=<RESTPROXY1_HOST>
# RBAC + principal propagation(使用者以 Basic 進入,MDS 驗證後以其身分連 Kafka)
kafka.rest.resource.extension.class=io.confluent.kafkarest.security.KafkaRestSecurityResourceExtension
listeners=https://0.0.0.0:8086
public.key.path=<SSL_DIR>/public.pem
rest.servlet.initializor.classes=io.confluent.common.security.jetty.initializer.AuthenticationHandler
ssl.client.authentication=REQUESTED
# REST Proxy 對外 HTTPS:共用 server 憑證
ssl.keystore.location=<SSL_DIR>/server.keystore.p12
ssl.keystore.password=<由 CyberArk 提供>
ssl.keystore.type=PKCS12
ssl.key.password=<由 CyberArk 提供>
ssl.truststore.location=<SSL_DIR>/truststore.p12
ssl.truststore.password=<由 CyberArk 提供>
ssl.truststore.type=PKCS12
