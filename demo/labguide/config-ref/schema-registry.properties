# schema-registry.properties — 由 tools/config-export.mjs 從已驗證的 demo 設定(schema-registry1)產生;<…> 為依環境填入的值
# 憑證主體取 CN(CN=c3 → c3;沒有任何 SR 角色)
auth.ssl.principal.mapping.rules=RULE:^CN=([a-zA-Z0-9.-]*).*$/$1/,DEFAULT
confluent.metadata.bootstrap.server.urls=https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094
confluent.metadata.server.urls.max.age.ms=60000
confluent.metadata.ssl.keystore.location=<SSL_DIR>/client-schema-registry.keystore.p12
confluent.metadata.ssl.keystore.password=<由 CyberArk 提供>
confluent.metadata.ssl.keystore.type=PKCS12
confluent.metadata.ssl.key.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.metadata.ssl.truststore.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.type=PKCS12
confluent.schema.registry.authorizer.class=io.confluent.kafka.schemaregistry.security.authorizer.rbac.RbacAuthorizer
confluent.schema.registry.auth.mechanism=JETTY_AUTH
# 沒設時 DEK Registry 的 KEK 端點對所有人 403(日誌:Couldn't find a corresponding operation to authorize);設了才依 Kek:<名稱> 的 role 授權
dek.registry.rbac.enable=true
host.name=<SR1_HOST>
# 只開 HTTPS 時必設,否則啟動失敗:No listener configured with requested scheme http
inter.instance.protocol=https
# 連 broker(_schemas topic):與 REST Proxy 相同做法——client 憑證(CN=schema-registry)向 MDS 換 token,OAUTHBEARER
kafkastore.bootstrap.servers=SASL_SSL://<BROKER1_HOST>:9094,SASL_SSL://<BROKER2_HOST>:9094,SASL_SSL://<BROKER3_HOST>:9094,SASL_SSL://<BROKER4_HOST>:9094
kafkastore.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
kafkastore.sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
kafkastore.sasl.mechanism=OAUTHBEARER
kafkastore.security.protocol=SASL_SSL
kafkastore.ssl.keystore.location=<SSL_DIR>/client-schema-registry.keystore.p12
kafkastore.ssl.keystore.password=<由 CyberArk 提供>
kafkastore.ssl.keystore.type=PKCS12
kafkastore.ssl.key.password=<由 CyberArk 提供>
kafkastore.ssl.truststore.location=<SSL_DIR>/truststore.p12
kafkastore.ssl.truststore.password=<由 CyberArk 提供>
kafkastore.ssl.truststore.type=PKCS12
listeners=https://0.0.0.0:8081
public.key.path=<SSL_DIR>/public.pem
# RBAC:使用者以 Basic(AD 帳密)或 Bearer(MDS token)進來,授權交給 MDS DekRegistry = KEK / DEK 管理(沒加時 /dek-registry/v1/* 回 404);RuleSetResource = 資料合約的 ruleSet(沒加時註冊 schema 會默默丟掉 ruleSet,不報錯)。舊註解: 後者 = DEK Registry(欄位級加密的 KEK / DEK 管理);沒加時 /dek-registry/v1/* 回 404
resource.extension.class=io.confluent.kafka.schemaregistry.security.SchemaRegistrySecurityResourceExtension,io.confluent.dekregistry.DekRegistryResourceExtension,io.confluent.kafka.schemaregistry.rulehandler.RuleSetResourceExtension
# 認證:同時接受「client 憑證(mTLS)」與「Token / AD 帳密」(InstallCompositeSecurityHandler)。 原因:C3 對 SR 的健康檢查固定打 / 且不帶使用者身分,只帶 client 憑證(CN=c3,C3 端以 alias.name 指定);若只用 InstallBearerOrBasicSecurityHandler(官方 RBAC 範例)會 401, C3 就判定 SR 全掛。使用者經 C3 的操作仍帶各自的 token(實測 gary 5 / yujie 1 / ming 0 個 subject)。 注意:這個 initializer 存在於官方安全外掛,但 SR 文件未寫 → 已列 CONFLUENT-QUESTIONS 確認支援範圍。
rest.servlet.initializor.classes=io.confluent.common.security.jetty.initializer.InstallCompositeSecurityHandler
schema.registry.group.id=schema-registry
# 有帶 client 憑證就驗(必須是行內 CA 簽的),沒帶照常走 Token / 帳密
ssl.client.authentication=REQUESTED
# 對外 HTTPS:共用 server 憑證(SAN 含 schema-registry)
ssl.keystore.location=<SSL_DIR>/server.keystore.p12
ssl.keystore.password=<由 CyberArk 提供>
ssl.keystore.type=PKCS12
ssl.key.password=<由 CyberArk 提供>
ssl.truststore.location=<SSL_DIR>/truststore.p12
ssl.truststore.password=<由 CyberArk 提供>
ssl.truststore.type=PKCS12
