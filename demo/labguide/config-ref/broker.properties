# server.properties — 由 tools/config-export.mjs 從已驗證的 demo 設定(broker1)產生;<…> 為依環境填入的值
advertised.listeners=INTERNAL://<BROKER1_HOST>:9092,CLIENT://<BROKER1_HOST>:9094
allow.everyone.if.no.acl.found=false
# --- 授權 ---
authorizer.class.name=io.confluent.kafka.security.authorizer.ConfluentServerAuthorizer
confluent.authorizer.access.rule.providers=CONFLUENT,KRAFT_ACL
# 第 31 章:scripts/sbc-setup.sh on 會在 .env 設 SBC_ENABLE=true(controller 與 broker 都要)
confluent.balancer.enable=false
confluent.balancer.topic.replication.factor=3
confluent.cluster.link.metadata.topic.replication.factor=3
confluent.license.topic.replication.factor=3
confluent.metadata.server.advertised.listeners=https://<BROKER1_HOST>:8091
confluent.metadata.server.authentication.method=BEARER
confluent.metadata.server.auth.ssl.principal.mapping.rules=RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/,DEFAULT
confluent.metadata.server.impersonation.protected.users=User:bootstrap;User:kafka-broker;User:kafka-controller;User:c3;User:restproxy;User:GARY
confluent.metadata.server.impersonation.super.users=User:restproxy
confluent.metadata.server.listeners=https://0.0.0.0:8091
confluent.metadata.server.ssl.client.authentication=REQUESTED
confluent.metadata.server.ssl.keystore.location=<SSL_DIR>/server.keystore.p12
confluent.metadata.server.ssl.keystore.password=<由 CyberArk 提供>
confluent.metadata.server.ssl.keystore.type=PKCS12
confluent.metadata.server.ssl.key.password=<由 CyberArk 提供>
confluent.metadata.server.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.metadata.server.ssl.truststore.password=<由 CyberArk 提供>
confluent.metadata.server.ssl.truststore.type=PKCS12
confluent.metadata.server.token.key.path=<SSL_DIR>/keypair.pem
confluent.metadata.server.token.max.lifetime.ms=3600000
confluent.metadata.server.token.signature.algorithm=RS256
confluent.metadata.topic.replication.factor=3
confluent.reporters.telemetry.auto.enable=false
confluent.security.event.logger.exporter.kafka.topic.replicas=3
# --- MDS:token ---
confluent.security.event.router.config={"destinations":{"topics":{"confluent-audit-log-events":{"retention_ms":604800000}}},"default_topics":{"allowed":"confluent-audit-log-events","denied":"confluent-audit-log-events"},"excluded_principals":["User:kafka-broker","User:kafka-controller"],"routes":{"crn:///kafka=*/topic=orders.*":{"produce":{"allowed":"confluent-audit-log-events","denied":"confluent-audit-log-events"},"consume":{"allowed":"","denied":"confluent-audit-log-events"},"describe":{"allowed":"","denied":"confluent-audit-log-events"}},"crn:///kafka=*/topic=payments.*":{"produce":{"allowed":"confluent-audit-log-events","denied":"confluent-audit-log-events"},"consume":{"allowed":"","denied":"confluent-audit-log-events"},"describe":{"allowed":"","denied":"confluent-audit-log-events"}},"crn:///kafka=*/topic=infra.*":{"produce":{"allowed":"confluent-audit-log-events","denied":"confluent-audit-log-events"},"consume":{"allowed":"","denied":"confluent-audit-log-events"},"describe":{"allowed":"","denied":"confluent-audit-log-events"}},"crn:///kafka=*":{"produce":{"allowed":"","denied":"confluent-audit-log-events"},"consume":{"allowed":"","denied":"confluent-audit-log-events"}}}}
# api.key / api.secret 就是 Prometheus 的 Basic 帳密
confluent.telemetry.exporter.c3plusplus.api.key=<由 CyberArk 提供>
confluent.telemetry.exporter.c3plusplus.api.secret=<由 CyberArk 提供>
confluent.telemetry.exporter.c3plusplus.buffer.batch.items.max=4000
confluent.telemetry.exporter.c3plusplus.buffer.inflight.submissions.max=10
confluent.telemetry.exporter.c3plusplus.buffer.pending.batches.max=80
confluent.telemetry.exporter.c3plusplus.client.base.url=https://<PROMETHEUS_HOST>:9090/api/v1/otlp
confluent.telemetry.exporter.c3plusplus.client.compression=gzip
confluent.telemetry.exporter.c3plusplus.enabled=true
confluent.telemetry.exporter.c3plusplus.https.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.telemetry.exporter.c3plusplus.https.ssl.truststore.password=<由 CyberArk 提供>
confluent.telemetry.exporter.c3plusplus.https.ssl.truststore.type=PKCS12
# 第 19 章:只加明確要用的指標(認證失敗/成功、重新認證失敗、連線數與上限)。名稱後面要加 (?!.*delta).*:同名的 delta 型態 Prometheus 不收,整批會被拒(實測,連原本的監控指標也跟著丟);也不要用萬用字元
confluent.telemetry.exporter.c3plusplus.metrics.include=io.confluent.kafka.server.request.(?!.*delta).*|io.confluent.kafka.server.server.broker.state|io.confluent.kafka.server.replica.manager.leader.count|io.confluent.kafka.server.request.queue.size|io.confluent.kafka.server.broker.topic.failed.produce.requests.rate.1.min|io.confluent.kafka.server.tier.archiver.total.lag|io.confluent.kafka.server.request.total.time.ms.p99|io.confluent.kafka.server.broker.topic.failed.fetch.requests.rate.1.min|io.confluent.kafka.server.broker.topic.total.fetch.requests.rate.1.min|io.confluent.kafka.server.partition.caught.up.replicas.count|io.confluent.kafka.server.partition.observer.replicas.count|io.confluent.kafka.server.tier.tasks.num.partitions.in.error|io.confluent.kafka.server.broker.topic.bytes.out.rate.1.min|io.confluent.kafka.server.request.total.time.ms.p95|io.confluent.kafka.server.controller.active.controller.count|io.confluent.kafka.server.request.total.time.ms.p999|io.confluent.kafka.server.controller.active.broker.count|io.confluent.kafka.server.request.handler.pool.request.handler.avg.idle.percent.rate.1.min|io.confluent.kafka.server.controller.unclean.leader.elections.rate.1.min|io.confluent.kafka.server.replica.manager.partition.count|io.confluent.kafka.server.controller.unclean.leader.elections.total|io.confluent.kafka.server.partition.replicas.count|io.confluent.kafka.server.broker.topic.total.produce.requests.rate.1.min|io.confluent.kafka.server.controller.offline.partitions.count|io.confluent.kafka.server.socket.server.network.processor.avg.idle.percent|io.confluent.kafka.server.partition.under.replicated|io.confluent.kafka.server.log.log.start.offset|io.confluent.kafka.server.log.tier.size|io.confluent.kafka.server.log.size|io.confluent.kafka.server.tier.fetcher.bytes.fetched.total|io.confluent.kafka.server.request.total.time.ms.p50|io.confluent.kafka.server.tenant.consumer.lag.offsets|io.confluent.kafka.server.log.log.end.offset|io.confluent.kafka.server.broker.topic.bytes.in.rate.1.min|io.confluent.kafka.server.partition.under.min.isr|io.confluent.kafka.server.partition.in.sync.replicas.count|io.confluent.telemetry.http.exporter.batches.dropped|io.confluent.telemetry.http.exporter.items.total|io.confluent.telemetry.http.exporter.items.succeeded|io.confluent.telemetry.http.exporter.send.time.total.millis|io.confluent.kafka.server.controller.leader.election.rate.(?!.*delta).*|io.confluent.telemetry.http.exporter.batches.failed|io.confluent.kafka.server.socket.server.failed.authentication.total(?!.*delta).*|io.confluent.kafka.server.socket.server.successful.authentication.total(?!.*delta).*|io.confluent.kafka.server.socket.server.failed.reauthentication.total(?!.*delta).*|io.confluent.kafka.server.socket.server.connection.count(?!.*delta).*|io.confluent.kafka.server.socket.server.connection.quotas.total.limit(?!.*delta).*
confluent.telemetry.exporter.c3plusplus.type=http
confluent.telemetry.metrics.collector.interval.ms=60000
confluent.telemetry.remoteconfig.confluent.enabled=false
controller.listener.names=CONTROLLER
controller.quorum.bootstrap.servers=<CONTROLLER1_HOST>:9093,<CONTROLLER2_HOST>:9093,<CONTROLLER3_HOST>:9093
default.replication.factor=3
# KRaft 下 Self-Balancing 跑在 controller,官方要求 controller 也設(第 31 章)
inter.broker.listener.name=INTERNAL
kafka.rest.bootstrap.servers=SASL_SSL://<BROKER1_HOST>:9094,SASL_SSL://<BROKER2_HOST>:9094,SASL_SSL://<BROKER3_HOST>:9094,SASL_SSL://<BROKER4_HOST>:9094
kafka.rest.client.security.protocol=SASL_SSL
kafka.rest.client.ssl.truststore.location=<SSL_DIR>/truststore.p12
kafka.rest.client.ssl.truststore.password=<由 CyberArk 提供>
kafka.rest.client.ssl.truststore.type=PKCS12
kafka.rest.confluent.metadata.bootstrap.server.urls=https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094
kafka.rest.confluent.metadata.ssl.truststore.location=<SSL_DIR>/truststore.p12
kafka.rest.confluent.metadata.ssl.truststore.password=<由 CyberArk 提供>
kafka.rest.confluent.metadata.ssl.truststore.type=PKCS12
kafka.rest.kafka.rest.resource.extension.class=io.confluent.kafkarest.security.KafkaRestSecurityResourceExtension
kafka.rest.public.key.path=<SSL_DIR>/public.pem
# --- broker 內建 Admin REST(/kafka/v3)的 RBAC 保護:屬性依官方 Admin REST Security 頁(kafka.rest. 前綴)。未設定時此 REST 完全無認證 ---
kafka.rest.rest.servlet.initializor.classes=io.confluent.common.security.jetty.initializer.InstallBearerOrBasicSecurityHandler
ldap.com.sun.jndi.ldap.read.timeout=3000
ldap.group.member.attribute=member
# 客戶 AD 的 member 格式 CN=<帳號大寫>,OU=…;(?i) 讓 demo 不管 DN 屬性名稱大小寫
ldap.group.member.attribute.pattern=(?i)CN=([^,]+),.*
ldap.group.name.attribute=cn
ldap.group.object.class=groupOfNames
ldap.group.search.base=ou=groups,<AD_BASE_DN>
# --- LDAP(模擬 AD):bind DN 唯讀查詢帳號 + 以群組成員屬性對映 ---
ldap.java.naming.factory.initial=com.sun.jndi.ldap.LdapCtxFactory
# AD 走 LDAPS(正式環境連 AD 的 636 或 3269);只有連 AD 的 JVM 需要 ldap.ssl.truststore
ldap.java.naming.provider.url=ldaps://<AD_HOST>:636
ldap.java.naming.security.authentication=simple
ldap.java.naming.security.credentials=<由 CyberArk 提供>
ldap.java.naming.security.principal=cn=svc-kafka-ldap,ou=system,<AD_BASE_DN>
ldap.java.naming.security.protocol=SSL
# 登入後的身分用 AD 紀錄的大小寫,不是使用者輸入的字串(實測 2026-10-05:使用者輸入 GARY 也對得到群組);原本只在 spike override,2026-10-06 納入主設定
ldap.principal.mapping=ldap
ldap.refresh.interval.ms=5000
ldap.search.mode=GROUPS
ldap.ssl.truststore.location=<SSL_DIR>/truststore.p12
ldap.ssl.truststore.password=<由 CyberArk 提供>
ldap.ssl.truststore.type=PKCS12
# 客戶的使用者名稱 = CN
ldap.user.name.attribute=cn
ldap.user.object.class=inetOrgPerson
ldap.user.search.base=ou=users,<AD_BASE_DN>
# 使用者分散在多層 OU,要搜尋整個子樹(官方預設 1)
ldap.user.search.scope=2
listeners=INTERNAL://<BROKER1_HOST>:9092,CLIENT://0.0.0.0:9094
# 第 19 章:SASL 連線每 60 秒重新認證(demo 為了讓實驗看得到效果;正式環境建議 1 小時,依 client 數量評估)。預設 0 = 連著就永遠有效,第 18 章實驗就是這個情況。這個設定不能動態改,要重啟 broker
listener.name.client.connections.max.reauth.ms=60000
listener.name.client.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required publicKeyPath="<SSL_DIR>/public.pem";
listener.name.client.oauthbearer.sasl.login.callback.handler.class=io.confluent.kafka.server.plugins.auth.token.TokenBearerServerLoginCallbackHandler
# --- CLIENT listener 同時接受 MDS 簽發的 token(OAUTHBEARER):C3 / REST Proxy 代表使用者、人用 confluent login 的腳本 ---
listener.name.client.oauthbearer.sasl.server.callback.handler.class=io.confluent.kafka.server.plugins.auth.token.TokenBearerValidatorCallbackHandler
listener.name.client.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required;
listener.name.client.plain.sasl.server.callback.handler.class=io.confluent.security.auth.provider.ldap.LdapAuthenticateCallbackHandler
# --- CLIENT listener:人 = PLAIN + LDAP;服務 = SCRAM ---
listener.name.client.sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-512,OAUTHBEARER
listener.name.client.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.controller.ssl.client.auth=required
listener.name.controller.ssl.keystore.location=<SSL_DIR>/internal.keystore.p12
listener.name.controller.ssl.keystore.password=<由 CyberArk 提供>
listener.name.controller.ssl.keystore.type=PKCS12
listener.name.controller.ssl.key.password=<由 CyberArk 提供>
listener.name.internal.ssl.client.auth=required
listener.name.internal.ssl.keystore.location=<SSL_DIR>/internal.keystore.p12
listener.name.internal.ssl.keystore.password=<由 CyberArk 提供>
listener.name.internal.ssl.keystore.type=PKCS12
listener.name.internal.ssl.key.password=<由 CyberArk 提供>
# controller 不監聽 INTERNAL,只是以 client 身分連 broker 的 INTERNAL 埠(balancer)
listener.security.protocol.map=CONTROLLER:SSL,INTERNAL:SSL,CLIENT:SASL_SSL
# Kafka 4.x:設了 metric.reporters 就不再自動帶 JmxReporter,要明確列出,否則 raft、socket-server 等指標不會出現在 JMX exporter
metric.reporters=org.apache.kafka.common.metrics.JmxReporter,io.confluent.telemetry.reporter.TelemetryReporter
min.insync.replicas=2
node.id=11
offsets.topic.replication.factor=3
password.encoder.secret=<由 CyberArk 提供>
process.roles=broker
# 只留 AEAD(GCM / ChaCha20);實測未設定時 broker 接受 ECDHE-RSA-AES128-SHA(CBC + SHA-1)
ssl.cipher.suites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
ssl.client.auth=none
# 第 19 章:只留 TLS 1.2 / 1.3(明確列出,不靠 JDK 預設)
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https
ssl.keystore.password=<由 CyberArk 提供>
ssl.keystore.location=<SSL_DIR>/server.keystore.p12
ssl.keystore.type=PKCS12
ssl.key.password=<由 CyberArk 提供>
# --- 內部通道:CONTROLLER(broker→controller)與 INTERNAL(broker↔broker)都是 mTLS,共用一張憑證 internal.keystore.p12(CN=kafka-internal)--- 不用 SASL:SCRAM 憑證存在 metadata 裡,刪除過 SCRAM 憑證後重啟 broker 會因為自己認證不過而起不來(見 RUNBOOK 第 19 章);mTLS 身分不依賴 metadata。 身分 = 憑證 CN(ssl.principal.mapping.rules)→ User:kafka-internal(在 super.users)。同一張憑證 broker 與 controller 共用,代價是 audit 看不出是哪一台。
ssl.principal.mapping.rules=RULE:^.*CN=([^,]*).*$/$1/,DEFAULT
ssl.truststore.location=<SSL_DIR>/truststore.p12
ssl.truststore.password=<由 CyberArk 提供>
ssl.truststore.type=PKCS12
super.users=User:kafka-internal;User:kafka-broker;User:kafka-controller;User:bootstrap
transaction.state.log.min.isr=2
transaction.state.log.replication.factor=3
