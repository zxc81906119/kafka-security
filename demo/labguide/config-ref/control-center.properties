# control-center.properties — 由 tools/config-export.mjs 從已驗證的 demo 設定(control-center)產生;<…> 為依環境填入的值
confluent.metadata.bootstrap.server.urls=https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094
confluent.metadata.ssl.keystore.location=<SSL_DIR>/client-c3.keystore.p12
confluent.metadata.ssl.keystore.password=<由 CyberArk 提供>
confluent.metadata.ssl.keystore.type=PKCS12
confluent.metadata.ssl.key.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.metadata.ssl.truststore.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.type=PKCS12
confluent.metrics.topic.replication=3
confluent.controlcenter.alertmanager.basic.auth.user.info=<由 CyberArk 提供>
confluent.controlcenter.alertmanager.config.file=<C3_CONFIG_DIR>/alertmanager-generated.yml
confluent.controlcenter.alertmanager.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.controlcenter.alertmanager.ssl.truststore.password=<由 CyberArk 提供>
confluent.controlcenter.alertmanager.url=https://<ALERTMANAGER_HOST>:9093
confluent.controlcenter.bootstrap.servers=SASL_SSL://<BROKER1_HOST>:9094,SASL_SSL://<BROKER2_HOST>:9094,SASL_SSL://<BROKER3_HOST>:9094,SASL_SSL://<BROKER4_HOST>:9094
# Connect 2 台:兩台都列出(官方:C3 用其中一台,失敗時改試另一台)。健康檢查打 /v1/metadata/id(不需認證),使用者的操作以自己的 token 轉送 confluent.controlcenter.connect.<名稱>.cluster;名稱取 connect
confluent.controlcenter.connect.connect.cluster=https://<CONNECT1_HOST>:8083,https://<CONNECT2_HOST>:8083
confluent.controlcenter.connect.connect.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.controlcenter.connect.connect.ssl.truststore.password=<由 CyberArk 提供>
confluent.controlcenter.internal.topics.partitions=1
confluent.controlcenter.metrics.topic.partitions=1
confluent.controlcenter.monitoring.interceptor.topic.partitions=1
confluent.controlcenter.prometheus.basic.auth.user.info=<由 CyberArk 提供>
# Prometheus / Alertmanager
confluent.controlcenter.prometheus.enable=true
confluent.controlcenter.prometheus.rules.file=<C3_CONFIG_DIR>/trigger_rules-generated.yml
confluent.controlcenter.prometheus.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.controlcenter.prometheus.ssl.truststore.password=<由 CyberArk 提供>
confluent.controlcenter.prometheus.url=https://<PROMETHEUS_HOST>:9090
confluent.controlcenter.replication.factor=3
# RBAC:使用者以 AD 帳號(經 MDS)登入;C3 自身向 MDS 以 mTLS(CN=c3)認證
confluent.controlcenter.rest.authentication.method=BEARER
# C3 UI(HTTPS):共用 server 憑證
confluent.controlcenter.rest.listeners=http://0.0.0.0:9021,https://0.0.0.0:9022
confluent.controlcenter.rest.ssl.keystore.location=<SSL_DIR>/server.keystore.p12
confluent.controlcenter.rest.ssl.keystore.password=<由 CyberArk 提供>
confluent.controlcenter.rest.ssl.keystore.type=PKCS12
confluent.controlcenter.rest.ssl.key.password=<由 CyberArk 提供>
confluent.controlcenter.rest.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.controlcenter.rest.ssl.truststore.password=<由 CyberArk 提供>
confluent.controlcenter.rest.ssl.truststore.type=PKCS12
# Schema Registry 2 台:兩台都列出。使用者在 C3 的操作以自己的 token 轉送,授權由 MDS 判斷(實測 gary 5 / yujie 1 / ming 0 個 subject)。 C3 自己的背景健康檢查(固定打 SR 的 /,沒有使用者身分)以 C3 的 client 憑證通過:keystore 放 client-c3, alias.name 指定用 c3(官方設定;沒指定時 C3 會拿自己對外 HTTPS 的 server 憑證去連,實測)。SR 端見 InstallCompositeSecurityHandler。
confluent.controlcenter.schema.registry.enable=true
confluent.controlcenter.schema.registry.schema.registry.alias.name=c3
confluent.controlcenter.schema.registry.schema.registry.ssl.keystore.location=<SSL_DIR>/client-c3.keystore.p12
confluent.controlcenter.schema.registry.schema.registry.ssl.keystore.password=<由 CyberArk 提供>
confluent.controlcenter.schema.registry.schema.registry.ssl.keystore.type=PKCS12
confluent.controlcenter.schema.registry.schema.registry.ssl.key.password=<由 CyberArk 提供>
confluent.controlcenter.schema.registry.schema.registry.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.controlcenter.schema.registry.schema.registry.ssl.truststore.password=<由 CyberArk 提供>
confluent.controlcenter.schema.registry.url=https://<SR1_HOST>:8081,https://<SR2_HOST>:8081
confluent.controlcenter.streams.cprest.url=https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094
confluent.controlcenter.streams.num.stream.threads=1
confluent.controlcenter.streams.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
confluent.controlcenter.streams.sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
confluent.controlcenter.streams.sasl.mechanism=OAUTHBEARER
# C3 自身連 Kafka(Streams):RBAC 下僅支援 OAUTHBEARER → 以 client 憑證(CN=c3)向 MDS 取 token,免 AD 帳號、免密碼
confluent.controlcenter.streams.security.protocol=SASL_SSL
confluent.controlcenter.streams.ssl.keystore.location=<SSL_DIR>/client-c3.keystore.p12
confluent.controlcenter.streams.ssl.keystore.password=<由 CyberArk 提供>
confluent.controlcenter.streams.ssl.keystore.type=PKCS12
confluent.controlcenter.streams.ssl.key.password=<由 CyberArk 提供>
confluent.controlcenter.streams.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.controlcenter.streams.ssl.truststore.password=<由 CyberArk 提供>
confluent.controlcenter.streams.ssl.truststore.type=PKCS12
public.key.path=<SSL_DIR>/public.pem
