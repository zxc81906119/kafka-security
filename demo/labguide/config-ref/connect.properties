# connect-distributed.properties — 由 tools/config-export.mjs 從已驗證的 demo 設定(connect1)產生;<…> 為依環境填入的值
admin.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
admin.sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
admin.sasl.mechanism=OAUTHBEARER
admin.security.protocol=SASL_SSL
admin.ssl.keystore.location=<SSL_DIR>/client-connect.keystore.p12
admin.ssl.keystore.password=<由 CyberArk 提供>
admin.ssl.keystore.type=PKCS12
admin.ssl.key.password=<由 CyberArk 提供>
admin.ssl.truststore.location=<SSL_DIR>/truststore.p12
admin.ssl.truststore.password=<由 CyberArk 提供>
admin.ssl.truststore.type=PKCS12
bootstrap.servers=<BROKER1_HOST>:9094,<BROKER2_HOST>:9094,<BROKER3_HOST>:9094,<BROKER4_HOST>:9094
# 連接器設定裡的密碼用 ${file:路徑:鍵} 引用,不把密碼寫進設定(設定會存進 connect-configs topic、也會從 REST 讀得到)
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.storage.replication.factor=3
config.storage.topic=connect-configs
confluent.metadata.bootstrap.server.urls=https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094
confluent.metadata.server.urls.max.age.ms=60000
confluent.metadata.ssl.keystore.location=<SSL_DIR>/client-connect.keystore.p12
confluent.metadata.ssl.keystore.password=<由 CyberArk 提供>
confluent.metadata.ssl.keystore.type=PKCS12
confluent.metadata.ssl.key.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.location=<SSL_DIR>/truststore.p12
confluent.metadata.ssl.truststore.password=<由 CyberArk 提供>
confluent.metadata.ssl.truststore.type=PKCS12
# 每個連接器可以用自己的身分連 Kafka(producer.override.* / consumer.override.* / admin.override.*),不必共用 worker 的身分
connector.client.config.override.policy=All
consumer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
consumer.sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
consumer.sasl.mechanism=OAUTHBEARER
consumer.security.protocol=SASL_SSL
consumer.ssl.keystore.location=<SSL_DIR>/client-connect.keystore.p12
consumer.ssl.keystore.password=<由 CyberArk 提供>
consumer.ssl.keystore.type=PKCS12
consumer.ssl.key.password=<由 CyberArk 提供>
consumer.ssl.truststore.location=<SSL_DIR>/truststore.p12
consumer.ssl.truststore.password=<由 CyberArk 提供>
consumer.ssl.truststore.type=PKCS12
group.id=connect-cluster
key.converter=org.apache.kafka.connect.storage.StringConverter
listeners=https://0.0.0.0:8083
listeners.https.ssl.keystore.location=<SSL_DIR>/server.keystore.p12
listeners.https.ssl.keystore.password=<由 CyberArk 提供>
listeners.https.ssl.keystore.type=PKCS12
listeners.https.ssl.key.password=<由 CyberArk 提供>
offset.storage.replication.factor=3
offset.storage.topic=connect-offsets
# 只掃外掛目錄:掃 /usr/share/java 全部要數分鐘(實測),轉換器與 provider 本來就在 classpath
plugin.path=/plugins,/usr/share/confluent-hub-components
producer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
producer.sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
producer.sasl.mechanism=OAUTHBEARER
producer.security.protocol=SASL_SSL
producer.ssl.keystore.location=<SSL_DIR>/client-connect.keystore.p12
producer.ssl.keystore.password=<由 CyberArk 提供>
producer.ssl.keystore.type=PKCS12
producer.ssl.key.password=<由 CyberArk 提供>
producer.ssl.truststore.location=<SSL_DIR>/truststore.p12
producer.ssl.truststore.password=<由 CyberArk 提供>
producer.ssl.truststore.type=PKCS12
public.key.path=<SSL_DIR>/public.pem
rest.advertised.host.name=<CONNECT1_HOST>
rest.advertised.listener=https
# RBAC:使用者以 Basic(AD 帳密)進來,授權交給 MDS(scope 含 connect-cluster = group.id)
rest.extension.classes=io.confluent.connect.security.ConnectSecurityExtension
rest.servlet.initializor.classes=io.confluent.common.security.jetty.initializer.InstallBearerOrBasicSecurityHandler
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required metadataServerUrls="https://<BROKER1_HOST>:8091,https://<BROKER2_HOST>:8092,https://<BROKER3_HOST>:8093,https://<BROKER4_HOST>:8094";
sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenCertificateLoginCallbackHandler
sasl.mechanism=OAUTHBEARER
# worker 自己的身分:client 憑證(CN=connect)向 MDS 換 token(與 Schema Registry、REST Proxy 同一種做法)
security.protocol=SASL_SSL
ssl.keystore.location=<SSL_DIR>/client-connect.keystore.p12
ssl.keystore.password=<由 CyberArk 提供>
ssl.keystore.type=PKCS12
ssl.key.password=<由 CyberArk 提供>
ssl.truststore.location=<SSL_DIR>/truststore.p12
ssl.truststore.password=<由 CyberArk 提供>
ssl.truststore.type=PKCS12
status.storage.replication.factor=3
status.storage.topic=connect-status
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
